version: 2.1
setup: true

parameters:
  gio_action:
    type: enum
    enum:
      [
        release,
        publish_rpms,
        publish_docker_images,
        pull_requests,
        release_notes_am,
        publish_maven_central,
        release_helm,
        publish-images-azure-registry,
        release-version,
        release-alpha-version,
        release-hotfix-version,
        integration-tests,
      ]
    default: pull_requests
  gio_product:
    type: enum
    enum: [am_v3, none]
    default: none
  dry_run:
    type: boolean
    default: true
    description: "Run in dry run mode?"
  rc_requested:
    type: boolean
    default: false
    description: "Do we have to release a RC"
  maven_profile_id:
    type: string
    default: "gravitee-dry-run"
    description: "Maven ID of the Maven profile to use for a dry run ?"
  secrethub_org:
    type: string
    default: "gravitee-lab"
    description: "SecretHub Org to use to fetch secrets ?"
  secrethub_repo:
    type: string
    default: "cicd"
    description: "SecretHub Repo to use to fetch secrets ?"
  graviteeio_version:
    type: string
    default: "cicd"
    description: "Release version number to use to publish the Docker nightly images ?"
  run-container-test:
    type: boolean
    default: false
  prune:
    type: boolean
    default: false
    description: "Do you want to [docker system prune -f --all] ? (clean up all cached docker images)"
  tag_latest:
    type: boolean
    default: false
    description: "Is this latest version of the Product ?"
  tag_latest_support:
    type: boolean
    default: true
    description: "Is this a latest support version of the Product ? (if so minor version tagging docker images). True by default."
  hotfix_version:
    type: boolean
    default: false
    description: "Is this a hotfix?"
  create_maintenance_version_branch:
    type: boolean
    default: false
    description: "Creates maintenance version branch"
  run_ui_tests:
    type: boolean
    default: true
    description: "Runs UI jest tests + Lint"
  # Migration test (trigger via API; setup continues with .circleci/workflows-migration.yml when set)
  migration_test_from_tag:
    type: string
    default: ""
  migration_test_to_tag:
    type: string
    default: ""
  migration_test_db_type:
    type: string
    default: ""
  migration_test_provider:
    type: string
    default: "k8s"
  migration_test_filter:
    type: string
    default: ""
  migration_test_registry:
    type: string
    default: ""
  migration_test_with_downgrade:
    type: string
    default: "true"

orbs:
  path-filtering: circleci/path-filtering@0.0.2
  continuation: circleci/continuation@2.0.1

jobs:
  # Wrapper so workflow-level when is applied by CircleCI (continuation/continue orb does not accept when).
  continuation:
    parameters:
      configuration_path:
        type: string
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      # Do not pass parameters: pipeline already has them from trigger; passing them again causes "Conflicting pipeline parameters".
      - continuation/continue:
          configuration_path: << parameters.configuration_path >>

workflows:
  # When migration is requested: one workflow, one job (no job-level when).
  migration-continuation-workflow:
    when:
      not:
        equal: [ "", << pipeline.parameters.migration_test_from_tag >> ]
    jobs:
      - continuation:
          name: migration-continuation
          configuration_path: .circleci/workflows-migration.yml
  # When integration tests are requested: continue with workflows.yml without path-filtering, whose mapping
  # would also start the testcontainer tests when the branch changes a repository module.
  integration-tests-continuation-workflow:
    when:
      and:
        - equal: [ "", << pipeline.parameters.migration_test_from_tag >> ]
        - equal: [ integration-tests, << pipeline.parameters.gio_action >> ]
    jobs:
      - continuation:
          name: integration-tests-continuation
          configuration_path: .circleci/workflows.yml
  # Otherwise: path-filtering then continue with workflows.yml.
  standard-workflow:
    when:
      and:
        - equal: [ "", << pipeline.parameters.migration_test_from_tag >> ]
        - not:
            equal: [ integration-tests, << pipeline.parameters.gio_action >> ]
    jobs:
      - path-filtering/filter:
          name: "Standard CI"
          # On Mergify backport branches, halt before continuation while unresolved
          # conflict markers are committed in the tree; the resolution push retriggers CI.
          # The when-condition scopes the extra checkout to those branches only.
          pre-steps:
            - when:
                condition:
                  matches:
                    pattern: "^mergify/(bp|copy)/.*"
                    value: << pipeline.git.branch >>
                steps:
                  - checkout
                  - run:
                      name: Halt on unresolved Mergify conflicts
                      command: |
                        # conflict marker written as a regex repetition: consecutive angle brackets break CircleCI config parsing
                        if git grep -IlqE '^<{7} ' -- .; then
                          echo "Unresolved Mergify conflict markers found - skipping CI until conflicts are resolved and pushed."
                          circleci-agent step halt
                        fi
          base-revision: << pipeline.git.branch >>
          config-path: .circleci/workflows.yml
          mapping: |
            gravitee-am-reporter/.* run-container-test true
            gravitee-am-repository/.* run-container-test true
            gravitee-am-dataplane/.* run-container-test true
            ^.*pom\.xml$ run-container-test true
            gravitee-am-ui/.* run_ui_tests true
