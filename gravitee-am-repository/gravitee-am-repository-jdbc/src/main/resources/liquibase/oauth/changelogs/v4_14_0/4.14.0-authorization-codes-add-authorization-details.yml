databaseChangeLog:
  - changeSet:
      id: 4.14.0-authorization-codes-add-authorization-details
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: authorization_codes
                columnName: authorization_details
      changes:
        - addColumn:
            tableName: authorization_codes
            columns:
              - column: { name: authorization_details, type: clob, constraints: { nullable: true } }
