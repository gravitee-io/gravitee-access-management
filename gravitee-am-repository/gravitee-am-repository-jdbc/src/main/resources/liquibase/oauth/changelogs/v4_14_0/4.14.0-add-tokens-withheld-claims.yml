databaseChangeLog:
  - changeSet:
      id: 4.14.0-add-tokens-withheld-claims
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: tokens
                columnName: withheld_claims
      changes:
        - addColumn:
            tableName: tokens
            columns:
              - column: { name: withheld_claims, type: clob, constraints: { nullable: true } }
