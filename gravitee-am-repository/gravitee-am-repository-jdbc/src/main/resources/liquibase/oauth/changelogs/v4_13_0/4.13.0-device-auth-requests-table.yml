databaseChangeLog:
  - changeSet:
      id: 4.13.0-device-auth-requests-table
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: device_auth_requests
      changes:
        ## device_auth_requests
        ###############################
        - createTable:
            tableName: device_auth_requests
            columns:
              - column: { name: id, type: nvarchar(128), constraints: { nullable: false } }
              - column: { name: user_code, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: client, type: nvarchar(255), constraints: { nullable: false } }
              - column: { name: subject, type: nvarchar(320), constraints: { nullable: true } }
              - column: { name: status, type: nvarchar(32), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp(6), constraints: { nullable: false } }
              - column: { name: last_access_at, type: timestamp(6), constraints: { nullable: false } }
              - column: { name: expire_at, type: timestamp(6), constraints: { nullable: false } }
              - column: { name: slow_down_count, type: integer, defaultValue: 0, constraints: { nullable: false } }
              - column: { name: scopes, type: clob, constraints: { nullable: true } }

        - addPrimaryKey:
            constraintName: pk_device_auth_requests
            columnNames: id
            tableName: device_auth_requests

        - createIndex:
            columns:
              - column:
                  name: user_code
            indexName: idx_device_auth_requests_user_code
            tableName: device_auth_requests
            unique: true

        - createIndex:
            columns:
              - column:
                  name: expire_at
            indexName: idx_device_auth_requests_expire
            tableName: device_auth_requests
            unique: false
