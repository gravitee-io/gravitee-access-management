databaseChangeLog:
  - changeSet:
      id: 4.13.0-trusted-domains-table
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: trusted_domains
      changes:
        - createTable:
            tableName: trusted_domains
            columns:
              - column: { name: id, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: reference_id, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: reference_type, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: name, type: nvarchar(255), constraints: { nullable: false } }
              - column: { name: description, type: nvarchar(1024), constraints: { nullable: true } }
              - column: { name: domain_identifier, type: nvarchar(512), constraints: { nullable: true } }
              - column: { name: key_material, type: clob, constraints: { nullable: true } }
              - column: { name: created_at, type: timestamp(6), constraints: { nullable: true } }
              - column: { name: updated_at, type: timestamp(6), constraints: { nullable: true } }

        - addPrimaryKey:
            constraintName: pk_trusted_domains
            columnNames: id
            tableName: trusted_domains

        - createIndex:
            columns:
              - column: { name: reference_type }
              - column: { name: reference_id }
              - column: { name: name }
            indexName: idx_trusted_domains_ref_name
            tableName: trusted_domains
            unique: true

  # Accepting this authority's JWTs during an RFC 8693 exchange.
  - changeSet:
      id: 4.13.0-trusted-domains-token-exchange-table
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: trusted_domains_token_exchange
      changes:
        - createTable:
            tableName: trusted_domains_token_exchange
            columns:
              - column: { name: trusted_domain_id, type: nvarchar(64), constraints: { primaryKey: true, nullable: false } }
              - column: { name: enabled, type: boolean, constraints: { nullable: false }, defaultValueBoolean: false }
              - column: { name: scope_mappings, type: clob, constraints: { nullable: true } }
              - column: { name: user_binding_enabled, type: boolean, constraints: { nullable: false }, defaultValueBoolean: false }
              - column: { name: user_binding_criteria, type: clob, constraints: { nullable: true } }

  # Accepting JWT-SVIDs from this authority as client assertions. The reference is repeated here so the
  # SPIFFE trust domain stays unique within the security domain without a read-before-write check.
  - changeSet:
      id: 4.13.0-trusted-domains-spiffe-table
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: trusted_domains_spiffe
      changes:
        - createTable:
            tableName: trusted_domains_spiffe
            columns:
              - column: { name: trusted_domain_id, type: nvarchar(64), constraints: { primaryKey: true, nullable: false } }
              - column: { name: reference_id, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: reference_type, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: spiffe_trust_domain, type: nvarchar(255), constraints: { nullable: true } }
              - column: { name: allowed_algorithms, type: clob, constraints: { nullable: true } }

  # What AM issues towards this authority: whether an ID-JAG may be minted, the expression producing
  # "aud_sub", and the outbound scope mappings.
  - changeSet:
      id: 4.13.0-trusted-domains-xaa-table
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: trusted_domains_xaa
      changes:
        - createTable:
            tableName: trusted_domains_xaa
            columns:
              - column: { name: trusted_domain_id, type: nvarchar(64), constraints: { primaryKey: true, nullable: false } }
              - column: { name: enabled, type: boolean, constraints: { nullable: false }, defaultValueBoolean: false }
              - column: { name: aud_sub_mapping, type: nvarchar(512), constraints: { nullable: true } }
              - column: { name: scope_mappings, type: clob, constraints: { nullable: true } }

  # The resource servers this authority exposes, one row each, replaced as a whole whenever the trusted
  # domain is written. The id is generated by AM and referenced by applications, so it never changes.
  - changeSet:
      id: 4.13.0-trusted-domains-xaa-resource-servers-table
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: trusted_domains_xaa_resource_servers
      changes:
        - createTable:
            tableName: trusted_domains_xaa_resource_servers
            columns:
              - column: { name: id, type: nvarchar(64), constraints: { primaryKey: true, nullable: false } }
              - column: { name: trusted_domain_id, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: name, type: nvarchar(255), constraints: { nullable: false } }
              - column: { name: resource, type: nvarchar(512), constraints: { nullable: false } }

        - createIndex:
            columns:
              - column: { name: trusted_domain_id }
              - column: { name: resource }
            indexName: idx_trusted_domains_xaa_rs_resource
            tableName: trusted_domains_xaa_resource_servers
            unique: true

  # An authority identifier, and a SPIFFE trust domain, are each vouched for by at most one trusted
  # domain per security domain. Trusted domains that do not declare one leave the column null, and
  # PostgreSQL / MySQL / MariaDB treat nulls as distinct in a unique index.
  - changeSet:
      id: 4.13.0-trusted-domains-unique-matchers
      author: GraviteeSource Team
      dbms: postgresql, mysql, mariadb
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: trusted_domains
                indexName: idx_trusted_domains_ref_identifier
      changes:
        - createIndex:
            columns:
              - column: { name: reference_type }
              - column: { name: reference_id }
              - column: { name: domain_identifier }
            indexName: idx_trusted_domains_ref_identifier
            tableName: trusted_domains
            unique: true

        - createIndex:
            columns:
              - column: { name: reference_type }
              - column: { name: reference_id }
              - column: { name: spiffe_trust_domain }
            indexName: idx_trusted_domains_spiffe_ref_matcher
            tableName: trusted_domains_spiffe
            unique: true

  # SQL Server treats nulls as equal in a unique index, so the same two constraints are filtered down
  # to the rows that actually carry a matcher. SQL Server refuses to build a filtered index unless
  # QUOTED_IDENTIFIER is ON, so the batch sets it rather than trusting the connection.
  - changeSet:
      id: 4.13.0-trusted-domains-unique-matchers-mssql
      author: GraviteeSource Team
      dbms: mssql
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: trusted_domains
                indexName: idx_trusted_domains_ref_identifier
      changes:
        - sql:
            splitStatements: false
            sql: |
              SET QUOTED_IDENTIFIER ON;
              CREATE UNIQUE INDEX idx_trusted_domains_ref_identifier ON trusted_domains (reference_type, reference_id, domain_identifier) WHERE domain_identifier IS NOT NULL;
              CREATE UNIQUE INDEX idx_trusted_domains_spiffe_ref_matcher ON trusted_domains_spiffe (reference_type, reference_id, spiffe_trust_domain) WHERE spiffe_trust_domain IS NOT NULL;

  # 4.12 rows are SPIFFE-only: the name was the matcher, and the key material lived in the
  # bundle_source / jwks_url pair the shared key-material shape replaced. trust_domains is left in
  # place, no longer read nor written.
  - changeSet:
      id: 4.13.0-trusted-domains-migrate-from-trust-domains
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: trust_domains
      changes:
        - sql:
            sql: |
              INSERT INTO trusted_domains (id, reference_id, reference_type, name, description, key_material, created_at, updated_at)
              SELECT td.id, td.reference_id, td.reference_type, td.name, td.description,
                     CASE
                       WHEN td.bundle_source = 'STATIC_JWKS' THEN CONCAT('{"source":"JWK_SET","refreshIntervalSeconds":', td.refresh_interval_seconds, '}')
                       WHEN td.bundle_source IS NOT NULL THEN CONCAT('{"source":"JWKS_URL","jwksUrl":"', COALESCE(td.jwks_url, ''), '","refreshIntervalSeconds":', td.refresh_interval_seconds, '}')
                       ELSE NULL
                     END,
                     td.created_at, td.updated_at
              FROM trust_domains td
              WHERE NOT EXISTS (SELECT 1 FROM trusted_domains existing WHERE existing.id = td.id)

        - sql:
            sql: |
              INSERT INTO trusted_domains_spiffe (trusted_domain_id, reference_id, reference_type, spiffe_trust_domain, allowed_algorithms)
              SELECT td.id, td.reference_id, td.reference_type, td.name, td.allowed_algorithms
              FROM trust_domains td
              WHERE NOT EXISTS (SELECT 1 FROM trusted_domains_spiffe existing WHERE existing.trusted_domain_id = td.id)
