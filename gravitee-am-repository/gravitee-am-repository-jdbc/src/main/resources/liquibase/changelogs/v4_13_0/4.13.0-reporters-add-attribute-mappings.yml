databaseChangeLog:
  - changeSet:
      id: 4.13.0-add-attribute-mappings-to-reporters
      author: GraviteeSource Team
      preConditions:
        onFail: MARK_RAN
        not:
          - columnExists:
              tableName: reporters
              columnName: attribute_mappings
      changes:
        #############################
        # reporters #
        ############################
        - addColumn:
            tableName: reporters
            columns:
              - column: { name: attribute_mappings, type: clob, constraints: { nullable: true } }
