databaseChangeLog:
  - changeSet:
      id: 4.13.0-domains-add-key-retrieval-settings-column
      author: GraviteeSource Team
      preConditions:
        onFail: MARK_RAN
        not:
          - columnExists:
              tableName: domains
              columnName: key_retrieval_settings
      changes:
        #############################
        # domains #
        ############################
        - addColumn:
            tableName: domains
            columns:
              - column: { name: key_retrieval_settings, type: clob, constraints: { nullable: true } }
