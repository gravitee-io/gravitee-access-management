# The *_pattern_ops opclasses are required since a plain btree cannot serve LIKE 'term%' under a
# non-C collation.
databaseChangeLog:

  - changeSet:
      id: 4.9.33-org-users-search-pattern-ops-1
      author: GraviteeSource Team
      preConditions:
        onFail: MARK_RAN
        dbms:
          type: postgresql
        not:
          - indexExists:
              indexName: idx_org_users_reference_username_pattern
              tableName: organization_users
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_org_users_reference_username_pattern ON organization_users USING btree (reference_id, reference_type, username varchar_pattern_ops);
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP INDEX IF EXISTS idx_org_users_reference_username_pattern;

