databaseChangeLog:
  - changeSet:
      id: 4.14.0-add-automation-columns-to-application-client-secrets
      author: GraviteeSource Team
      preConditions:
        onFail: MARK_RAN
        not:
          - columnExists:
              tableName: application_client_secrets
              columnName: automation_key
      changes:
        - addColumn:
            tableName: application_client_secrets
            columns:
              - column:
                  name: automation_key
                  type: nvarchar(64)
                  constraints:
                    nullable: true
              - column:
                  name: managed_by
                  type: nvarchar(64)
                  constraints:
                    nullable: true
