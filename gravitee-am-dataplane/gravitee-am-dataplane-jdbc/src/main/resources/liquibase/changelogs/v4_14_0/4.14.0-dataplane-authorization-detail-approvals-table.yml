databaseChangeLog:
  - changeSet:
      id: 4.14.0-dataplane-authorization-detail-approvals-table
      author: GraviteeSource Team
      changes:
        - createTable:
            tableName: authorization_detail_approvals
            columns:
              - column: { name: id, type: nvarchar(64), constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_authorization_detail_approvals } }
              - column: { name: domain, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: client_id, type: nvarchar(255), constraints: { nullable: false } }
              - column: { name: user_id, type: nvarchar(64) }
              - column: { name: user_external_id, type: nvarchar(255) }
              - column: { name: user_source, type: nvarchar(64) }
              - column: { name: detail, type: clob }
              - column: { name: digest, type: nvarchar(64), constraints: { nullable: false } }
              - column: { name: status, type: nvarchar(64) }
              - column: { name: expires_at, type: timestamp(6) }
              - column: { name: created_at, type: timestamp(6) }
              - column: { name: updated_at, type: timestamp(6) }

        - createIndex:
            tableName: authorization_detail_approvals
            indexName: idx_authorization_detail_approvals_domain_client_user_digest
            columns:
              - column: { name: domain }
              - column: { name: client_id }
              - column: { name: user_id }
              - column: { name: digest }

        - createIndex:
            tableName: authorization_detail_approvals
            indexName: idx_authorization_detail_approvals_domain_client_user_ext_digest
            columns:
              - column: { name: domain }
              - column: { name: client_id }
              - column: { name: user_source }
              - column: { name: user_external_id }
              - column: { name: digest }

        - createIndex:
            tableName: authorization_detail_approvals
            indexName: idx_authorization_detail_approvals_domain_user
            columns:
              - column: { name: domain }
              - column: { name: user_id }

        - createIndex:
            tableName: authorization_detail_approvals
            indexName: idx_authorization_detail_approvals_domain_user_ext
            columns:
              - column: { name: domain }
              - column: { name: user_source }
              - column: { name: user_external_id }

        - createIndex:
            tableName: authorization_detail_approvals
            indexName: idx_authorization_detail_approvals_expire
            columns:
              - column: { name: expires_at }
