# Runs the integration test suites of the selected branch ("Use workflow from") against the latest AM
# images the Azure registry holds for that branch.
name: Trigger Integration Tests

on:
  workflow_dispatch:

jobs:
  trigger-circleci:
    runs-on: ubuntu-latest
    steps:
      - name: "Trigger CircleCI integration tests"
        run: |
          RESPONSE=$(curl -fsS -X POST https://circleci.com/api/v2/project/gh/${ORG_NAME}/${REPO_NAME}/pipeline \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Circle-Token: ${CCI_TOKEN}" \
            -d "$(jq -n --arg branch "${BRANCH}" '{branch: $branch, parameters: {gio_action: "integration-tests"}}')")
          echo "${RESPONSE}" | jq .
          echo "CircleCI pipeline: https://app.circleci.com/pipelines/gh/${ORG_NAME}/${REPO_NAME}/$(echo "${RESPONSE}" | jq -r .number)" >> "${GITHUB_STEP_SUMMARY}"
        env:
          ORG_NAME: gravitee-io
          REPO_NAME: gravitee-access-management
          BRANCH: ${{ github.ref_name }}
          CCI_TOKEN: ${{ secrets.CCI_TOKEN }}
