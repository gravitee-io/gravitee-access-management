name: Trigger Migration Test

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: "Source version tag (e.g., 4.10.5)"
        required: true
        default: "4.10.5"
      to_tag:
        description: "Target version tag (e.g., latest)"
        required: true
        default: "latest"
      db_type:
        description: "Database type"
        required: true
        type: choice
        options:
          - mongodb
          - postgres
        default: "mongodb"

jobs:
  trigger-circleci:
    runs-on: ubuntu-latest
    steps:
      - name: "Trigger CircleCI Migration Test"
        env:
          CCI_TOKEN: ${{ secrets.CCI_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          FROM_TAG: ${{ github.event.inputs.from_tag }}
          TO_TAG: ${{ github.event.inputs.to_tag }}
          DB_TYPE: ${{ github.event.inputs.db_type }}
        run: |
          curl -X POST https://circleci.com/api/v2/project/gh/gravitee-io/gravitee-access-management/pipeline \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Circle-Token: $CCI_TOKEN" \
            -d "{
              \"branch\": \"$BRANCH\",
              \"parameters\": {
                \"migration_test_from_tag\": \"$FROM_TAG\",
                \"migration_test_to_tag\": \"$TO_TAG\",
                \"migration_test_db_type\": \"$DB_TYPE\",
                \"migration_test_provider\": \"k8s\"
              }
            }"
