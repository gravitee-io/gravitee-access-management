openapi: 3.0.1
info:
  contact:
    email: team-gko@graviteesource.com
    name: DevX team
    url: https://www.gravitee.io/
  description: |-
    Declarative, idempotent management of Gravitee Access Management resources.

    Each resource is identified by a stable, immutable `key` that you choose. Applying a resource with `PUT` creates it on first use and updates it on subsequent applies, so the same request can be replayed safely to converge on a desired state.

    The API only sees and manages resources it owns (those marked as managed by the Automation API). Resources created through the Management API or console are invisible to these endpoints and cannot be read, updated, or deleted here; conversely, resources created here are fully owned by the Automation API.

    Domains are the top-level resource; certificates, identity providers, and reporters are managed as sub-resources of a domain. Deleting a domain cascades to its Automation-managed sub-resources. Some sub-resources support a `system` flag identifying the domain's built-in default; the flag is immutable once set.

    This API complements the Management API, which remains the interactive, full-featured management surface.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Gravitee.io AM - Automation API
  version: 4.14.0
servers:
- url: http://localhost:8093/automation
security:
- BearerAuth: []
tags:
- description: Applications (OAuth 2.0 / OpenID Connect clients) configured under
    a domain.
  name: Applications
- description: Certificates configured under a domain to sign and verify tokens.
  name: Certificates
- description: Data planes configured under an environment to store the runtime data
    of its domains.
  name: Data Planes
- description: "Security domains: the top-level container for an authentication and\
    \ authorization configuration. Create, read, update, and delete domains, and reach\
    \ their sub-resources."
  name: Domains
- description: Identity providers configured under a domain to authenticate users.
  name: Identity Providers
- description: Reporters configured under a domain to persist audit events to a backend.
  name: Reporters
paths:
  /organizations/{orgId}/environments/{envId}/dataplanes:
    get:
      description: Returns all data planes managed by the Automation API in the environment.
        Data planes provisioned outside the Automation API are not returned.
      operationId: automationListDataPlanes
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                DataPlaneList:
                  description: DataPlaneList
                  value:
                  - id: acme-eu
                    name: ACME EU data plane
                    type: mongodb
                    gatewayUrl: https://gateway-eu.example.com
                    database: gravitee-am-acme
                    hosts:
                    - mongo:27017
                    organizationId: DEFAULT
                    environmentId: DEFAULT
                    createdAt: 2026-01-15T09:30:00.000Z
                    updatedAt: 2026-01-15T09:30:00.000Z
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationDataPlane"
          description: List of data planes
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        default:
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 500
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: List an environment's data planes
      tags:
      - Data Planes
    put:
      description: "Idempotent create-or-update. Uses the id field in the body to\
        \ identify the data plane within the environment. The type is immutable, and\
        \ the organization and environment come from the path. An id: reference updates\
        \ a data plane the Automation API does not manage, and cannot create one."
      operationId: automationCreateOrUpdateDataPlane
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              DataPlane:
                description: A MongoDB data plane
                value:
                  id: acme-eu
                  name: ACME EU data plane
                  type: mongodb
                  gatewayUrl: https://gateway-eu.example.com
                  configuration:
                    mongodb:
                      dbname: gravitee-am-acme
                      host: mongo
                      port: 27017
            schema:
              $ref: "#/components/schemas/AutomationDataPlane"
        description: Desired state of the data plane.
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                DataPlane:
                  description: DataPlane
                  value:
                    id: acme-eu
                    name: ACME EU data plane
                    type: mongodb
                    gatewayUrl: https://gateway-eu.example.com
                    database: gravitee-am-acme
                    hosts:
                    - mongo:27017
                    organizationId: DEFAULT
                    environmentId: DEFAULT
                    createdAt: 2026-01-15T09:30:00.000Z
                    updatedAt: 2026-01-15T09:30:00.000Z
              schema:
                $ref: "#/components/schemas/AutomationDataPlane"
          description: The created or updated data plane
        "400":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 400
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Invalid request: a missing required field, an unknown data\
            \ plane type, a configuration the type's plugin rejects, an id reserved\
            \ by the node's gravitee.yml, or an attempt to change an immutable field"
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        "404":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 404
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "An id: reference naming a data plane that does not exist in\
            \ this environment"
        "409":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 409
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: The id is already taken by a data plane the Automation API
            does not manage
      summary: Create or update a data plane
      tags:
      - Data Planes
  /organizations/{orgId}/environments/{envId}/dataplanes/{dataPlaneId}:
    delete:
      description: Deletes an Automation-managed data plane by its id. Deleting a
        data plane that does not exist also returns 204.
      operationId: automationDeleteDataPlane
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: Id of the data plane within the environment.
        example: acme-eu
        in: path
        name: dataPlaneId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Data plane successfully deleted
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        "409":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 409
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: At least one domain still references the data plane
      summary: Delete a data plane
      tags:
      - Data Planes
    get:
      description: Retrieves a single Automation-managed data plane by its id.
      operationId: automationGetDataPlane
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: Id of the data plane within the environment.
        example: acme-eu
        in: path
        name: dataPlaneId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                DataPlane:
                  description: DataPlane
                  value:
                    id: acme-eu
                    name: ACME EU data plane
                    type: mongodb
                    gatewayUrl: https://gateway-eu.example.com
                    database: gravitee-am-acme
                    hosts:
                    - mongo:27017
                    organizationId: DEFAULT
                    environmentId: DEFAULT
                    createdAt: 2026-01-15T09:30:00.000Z
                    updatedAt: 2026-01-15T09:30:00.000Z
              schema:
                $ref: "#/components/schemas/AutomationDataPlane"
          description: The data plane
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        "404":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 404
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Data plane not found in this environment, or not managed by\
            \ the Automation API"
      summary: Get a data plane
      tags:
      - Data Planes
  /organizations/{orgId}/environments/{envId}/domains:
    get:
      description: Returns all security domains within the specified environment.
      operationId: automationListDomains
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                AutomationDomainList:
                  value:
                  - key: example-domain
                    name: Example domain
                    description: An example authentication domain
                    enabled: true
                    path: /example-domain
                    dataPlaneId: default
                    tags:
                    - eu
                    - production
                    accountSettings:
                      inherited: false
                      loginAttemptsDetectionEnabled: true
                      maxLoginAttempts: 10
                      accountBlockedDuration: 7200
                    oidc:
                      redirectUriStrictMatching: true
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationDomain"
          description: List of domains
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        default:
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 500
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: List all domains
      tags:
      - Domains
    put:
      description: "Idempotent create-or-update. Uses the key field in the body to\
        \ identify the domain. On first apply the domain is created; subsequent applies\
        \ update it. dataPlaneId is optional at creation, resolved from the environment's\
        \ data planes when omitted, and immutable afterwards. When dryRun is true,\
        \ the endpoint validates the payload without persisting; the returned domain\
        \ carries a dryRunErrors list (empty on success, populated with validation\
        \ errors otherwise)."
      operationId: automationCreateOrUpdateDomain
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: "When true, validates the payload without persisting. The returned\
          \ domain includes a dryRunErrors field."
        in: query
        name: dryRun
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            examples:
              Domain:
                description: A domain with common settings
                value:
                  key: example-domain
                  name: Example domain
                  description: An example authentication domain
                  enabled: true
                  path: /example-domain
                  dataPlaneId: default
                  tags:
                  - eu
                  - production
                  accountSettings:
                    inherited: false
                    loginAttemptsDetectionEnabled: true
                    maxLoginAttempts: 10
                    accountBlockedDuration: 7200
                  oidc:
                    redirectUriStrictMatching: true
            schema:
              $ref: "#/components/schemas/AutomationDomain"
        description: Desired state of the domain.
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Domain:
                  description: A domain with common settings
                  value:
                    key: example-domain
                    name: Example domain
                    description: An example authentication domain
                    enabled: true
                    path: /example-domain
                    dataPlaneId: default
                    tags:
                    - eu
                    - production
                    accountSettings:
                      inherited: false
                      loginAttemptsDetectionEnabled: true
                      maxLoginAttempts: 10
                      accountBlockedDuration: 7200
                    oidc:
                      redirectUriStrictMatching: true
              schema:
                $ref: "#/components/schemas/AutomationDomain"
          description: The created or updated domain. When dryRun is true the domain
            includes a dryRunErrors field with any validation errors.
        "400":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 400
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Invalid request: validation failure, an immutable field change,\
            \ or a key that already exists for a domain not managed by the Automation\
            \ API"
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
      summary: Create or update a domain
      tags:
      - Domains
  /organizations/{orgId}/environments/{envId}/domains/{domainKey}:
    delete:
      description: "Deletes an Automation-managed domain. Deletion cascades to the\
        \ domain's sub-resources (certificates, identity providers, and reporters).\
        \ Deleting a domain that does not exist also returns 204."
      operationId: automationDeleteDomain
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: "Key of the domain: its stable, immutable Automation identifier\
          \ within the environment."
        example: example-domain
        in: path
        name: domainKey
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Domain successfully deleted
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        default:
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 500
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: Delete a domain
      tags:
      - Domains
    get:
      description: Retrieves a single Automation-managed security domain by its key.
      operationId: automationGetDomain
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: "Key of the domain: its stable, immutable Automation identifier\
          \ within the environment."
        example: example-domain
        in: path
        name: domainKey
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                Domain:
                  description: A domain with common settings
                  value:
                    key: example-domain
                    name: Example domain
                    description: An example authentication domain
                    enabled: true
                    path: /example-domain
                    dataPlaneId: default
                    tags:
                    - eu
                    - production
                    accountSettings:
                      inherited: false
                      loginAttemptsDetectionEnabled: true
                      maxLoginAttempts: 10
                      accountBlockedDuration: 7200
                    oidc:
                      redirectUriStrictMatching: true
              schema:
                $ref: "#/components/schemas/AutomationDomain"
          description: The domain
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        "404":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 404
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Domain not found, or not managed by the Automation API"
      summary: Get a domain
      tags:
      - Domains
  /organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications:
    get:
      description: Returns all applications managed by the Automation API under the
        domain. Applications created outside the Automation API are not returned.
        Client secrets are never returned.
      operationId: automationListApplications
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: "Key of the domain: its stable, immutable Automation identifier\
          \ within the environment."
        example: example-domain
        in: path
        name: domainKey
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                AutomationApplicationList:
                  value:
                  - key: mobile-app
                    name: Mobile app
                    type: native
                    certificate: signing-cert
                    identityProviders:
                    - identity: customer-users
                      priority: 0
                    settings:
                      oauth:
                        grantTypes:
                        - authorization_code
                        - refresh_token
                        redirectUris:
                        - com.example.app:/callback
                        scopeSettings:
                        - scope: openid
                          defaultScope: true
                        - scope: profile
                        tokenEndpointAuthMethod: none
                        forcePKCE: true
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationApplication"
          description: List of applications
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        "404":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 404
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Domain not found, or not managed by the Automation API"
      summary: List a domain's applications
      tags:
      - Applications
      - Domains
    put:
      description: "Idempotent create-or-update. Uses the key field in the body to\
        \ identify the application within the domain. On first apply the application\
        \ is created; subsequent applies update it to the desired state: omitted fields\
        \ are reset, and computed fields are computed again. No client secret is ever\
        \ generated nor returned. The certificate and the identity providers are references\
        \ (key or id:<uuid>) that are not checked for existence; the scopes must exist\
        \ in the domain. The clientId is immutable once set. The type can be changed,\
        \ except to or from agent. Disabling the application revokes its tokens. When\
        \ dryRun is true, the endpoint validates the payload without persisting; the\
        \ returned application carries a dryRunErrors list (absent on success, populated\
        \ with validation errors otherwise)."
      operationId: automationCreateOrUpdateApplication
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: "Key of the domain: its stable, immutable Automation identifier\
          \ within the environment."
        example: example-domain
        in: path
        name: domainKey
        required: true
        schema:
          type: string
      - description: "When true, validates the payload without persisting. The returned\
          \ application includes a dryRunErrors field."
        in: query
        name: dryRun
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            examples:
              Mobile application:
                description: A native mobile application using the authorization code
                  flow with PKCE
                value:
                  key: mobile-app
                  name: Mobile app
                  type: native
                  certificate: signing-cert
                  identityProviders:
                  - identity: customer-users
                    priority: 0
                  settings:
                    oauth:
                      grantTypes:
                      - authorization_code
                      - refresh_token
                      redirectUris:
                      - com.example.app:/callback
                      scopeSettings:
                      - scope: openid
                        defaultScope: true
                      - scope: profile
                      tokenEndpointAuthMethod: none
                      forcePKCE: true
            schema:
              $ref: "#/components/schemas/AutomationApplication"
        description: Desired state of the application.
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Mobile application:
                  description: A native mobile application using the authorization
                    code flow with PKCE
                  value:
                    key: mobile-app
                    name: Mobile app
                    type: native
                    certificate: signing-cert
                    identityProviders:
                    - identity: customer-users
                      priority: 0
                    settings:
                      oauth:
                        grantTypes:
                        - authorization_code
                        - refresh_token
                        redirectUris:
                        - com.example.app:/callback
                        scopeSettings:
                        - scope: openid
                          defaultScope: true
                        - scope: profile
                        tokenEndpointAuthMethod: none
                        forcePKCE: true
              schema:
                $ref: "#/components/schemas/AutomationApplication"
          description: The created or updated application. When dryRun is true the
            application includes a dryRunErrors field with any validation errors.
        "400":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 400
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Invalid request: a key conflict, an invalid setting, an unknown\
            \ scope, a duplicate or changed clientId, or a type change to or from\
            \ agent"
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        "404":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 404
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Domain not found, or not managed by the Automation API; or\
            \ an id:<uuid> application that does not exist"
      summary: Create or update an application
      tags:
      - Applications
      - Domains
  /organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}:
    delete:
      description: "Deletes an Automation-managed application by its key, or any application\
        \ of the domain by id:<uuid>. Deleting an application that does not exist\
        \ also returns 204."
      operationId: automationDeleteApplication
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
