        required: true
        schema:
          type: string
      - description: "Key of the domain: its stable, immutable Automation identifier\
          \ within the environment."
        example: example-domain
        in: path
        name: domainKey
        required: true
        schema:
          type: string
      - description: "When true, validates the payload without persisting. The returned\
          \ reporter includes a dryRunErrors field."
        in: query
        name: dryRun
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            examples:
              Reporter:
                description: A fully specified reporter
                value:
                  key: audit-kafka
                  name: Audit events to Kafka
                  type: reporter-am-kafka
                  enabled: true
                  configuration: "{\"bootstrapServers\":\"kafka:9092\",\"topic\":\"\
                    audit\"}"
              System reporter:
                description: The domain's system reporter; only system and key are
                  needed
                value:
                  key: default
                  system: true
            schema:
              $ref: "#/components/schemas/AutomationReporter"
        description: "Desired state of the reporter. For a system reporter, supply\
          \ only system: true and key."
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                Reporter:
                  description: A fully specified reporter
                  value:
                    key: audit-kafka
                    name: Audit events to Kafka
                    type: reporter-am-kafka
                    enabled: true
                    configuration: "{\"bootstrapServers\":\"kafka:9092\",\"topic\"\
                      :\"audit\"}"
                System reporter:
                  description: The domain's system reporter; only system and key are
                    needed
                  value:
                    key: default
                    system: true
              schema:
                $ref: "#/components/schemas/AutomationReporter"
          description: The created or updated reporter. When dryRun is true the reporter
            includes a dryRunErrors field with any validation errors.
        "400":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 400
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Invalid request: a key conflict, a missing required field\
            \ (name, type, or configuration) for a non-system reporter, an attempt\
            \ to change the immutable system flag, or a second system reporter for\
            \ the domain"
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        "404":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 404
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Domain not found, or not managed by the Automation API"
      summary: Create or update a reporter
      tags:
      - Reporters
      - Domains
  /organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters/{reporterKey}:
    delete:
      description: Deletes an Automation-managed reporter by its key. Deleting a reporter
        that does not exist also returns 204.
      operationId: automationDeleteReporter
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: "Key of the domain: its stable, immutable Automation identifier\
          \ within the environment."
        example: example-domain
        in: path
        name: domainKey
        required: true
        schema:
          type: string
      - description: Key of the reporter within the domain.
        example: audit-kafka
        in: path
        name: reporterKey
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Reporter successfully deleted
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        default:
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 500
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: Delete a reporter
      tags:
      - Reporters
      - Domains
    get:
      description: Retrieves a single Automation-managed reporter by its key.
      operationId: automationGetReporter
      parameters:
      - description: Identifier of the organization that owns the environment.
        example: DEFAULT
        in: path
        name: orgId
        required: true
        schema:
          type: string
      - description: Identifier of the environment the resource belongs to.
        example: DEFAULT
        in: path
        name: envId
        required: true
        schema:
          type: string
      - description: "Key of the domain: its stable, immutable Automation identifier\
          \ within the environment."
        example: example-domain
        in: path
        name: domainKey
        required: true
        schema:
          type: string
      - description: Key of the reporter within the domain.
        example: audit-kafka
        in: path
        name: reporterKey
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                Reporter:
                  description: A fully specified reporter
                  value:
                    key: audit-kafka
                    name: Audit events to Kafka
                    type: reporter-am-kafka
                    enabled: true
                    configuration: "{\"bootstrapServers\":\"kafka:9092\",\"topic\"\
                      :\"audit\"}"
                System reporter:
                  description: The domain's system reporter; only system and key are
                    needed
                  value:
                    key: default
                    system: true
              schema:
                $ref: "#/components/schemas/AutomationReporter"
          description: The reporter
        "403":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 403
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: Permission denied
        "404":
          content:
            application/json:
              examples:
                error:
                  value:
                    http_status: 404
                    message: A human-readable description of the error
              schema:
                $ref: "#/components/schemas/Error"
          description: "Domain or reporter not found, or not managed by the Automation\
            \ API"
      summary: Get a reporter
      tags:
      - Reporters
      - Domains
components:
  schemas:
    ApplicationCrossAppAccessResourceServer:
      type: object
      description: A resource server this application may request an ID-JAG for.
      properties:
        clientId:
          type: string
          description: Identifier this application is registered with at the resource
            authorization server.
          example: acme-calendar-client
          maxLength: 512
        resourceServerId:
          type: string
          description: "Identifier of the resource server, as generated by AM on the\
            \ trusted domain."
        trustDomainId:
          type: string
          description: Identifier of the trusted domain the resource server belongs
            to. A hint used to resolve the resource server; the resource server identifier
            remains authoritative.
      title: Cross App Access resource server mapping
    ApplicationCrossAppAccessSettings:
      type: object
      description: Resource servers this application may request an ID-JAG for.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether this application participates in Cross App Access.
        resourceServers:
          type: array
          description: "Resource servers this application may reach, one entry per\
            \ resource server."
          items:
            $ref: "#/components/schemas/ApplicationCrossAppAccessResourceServer"
      title: Application Cross App Access settings
    ApplicationLightweightJwtSettings:
      type: object
      description: Restricts the JWT access token and the ID token returned to the
        client to the reserved protocol claims and the allowlisted claims.
      properties:
        allowedAccessTokenClaims:
          type: array
          description: Claim names kept in the access and refresh tokens in addition
            to the reserved claims. A listed claim is kept only if AM issues it.
          items:
            type: string
            maxLength: 128
        allowedIdTokenClaims:
          type: array
          description: Claim names kept in the ID token in addition to the reserved
            claims. A listed claim is kept only if AM issues it.
          items:
            type: string
            maxLength: 128
        enabled:
          type: boolean
          default: false
          description: Whether Lightweight JWT is enabled.
      title: Application Lightweight JWT settings
    AutomationAccountSettings:
      type: object
      description: "User account settings for the domain: brute-force protection,\
        \ registration, password reset, remember-me, and MFA challenge behavior."
      properties:
        accountBlockedDuration:
          type: integer
          format: int32
          description: "Duration, in seconds, for which the account remains blocked\
            \ after too many failed login attempts."
          example: 7200
        autoLoginAfterRegistration:
          type: boolean
          default: false
          description: Whether the user is automatically logged in after completing
            registration.
        autoLoginAfterResetPassword:
          type: boolean
          default: false
          description: Whether the user is automatically logged in after a password
            reset.
        completeRegistrationWhenResetPassword:
          type: boolean
          default: false
          description: Whether resetting a password also completes a pending registration.
        defaultIdentityProviderForRegistration:
          type: string
          description: "Key of an identity provider managed under this domain, used\
            \ as the default for user registration. The reference is not checked against\
            \ existing identity providers: it can name one created after the domain\
            \ or since deleted, and resolves whenever an identity provider with that\
            \ key exists."
          example: users-idp
        deletePasswordlessDevicesAfterResetPassword:
          type: boolean
          default: false
          description: Whether passwordless (WebAuthn) devices are deleted when the
            password is reset.
        dynamicUserRegistration:
          type: boolean
          default: false
          description: Whether dynamic (self-service) user registration is enabled.
        inherited:
          type: boolean
          default: true
          description: "Whether account settings are inherited from the parent (domain).\
            \ When true, the other fields are ignored. Has no effect when applied\
            \ to domains."
        loginAttemptsDetectionEnabled:
          type: boolean
          default: false
          description: Whether brute-force authentication attempts are detected and
            blocked.
        loginAttemptsResetTime:
          type: integer
          format: int32
          description: "Time, in seconds, after which the login attempt counter is\
            \ reset when the maximum has not been reached."
          example: 600
        maxLoginAttempts:
          type: integer
          format: int32
          description: Maximum number of failed login attempts before the account
            is blocked.
          example: 10
        mfaChallengeAttemptsDetectionEnabled:
          type: boolean
          default: false
          description: Whether failed MFA challenge attempts are detected and blocked.
        mfaChallengeAttemptsResetTime:
          type: integer
          format: int32
          description: "Time, in seconds, after which the MFA challenge attempt counter\
            \ is reset."
          example: 600
        mfaChallengeMaxAttempts:
          type: integer
          format: int32
          description: Maximum number of failed MFA challenge attempts before the
            user is blocked.
          example: 3
        mfaChallengeSendVerifyAlertEmail:
          type: boolean
          default: false
          description: Whether to send an alert email after too many failed MFA challenge
            attempts.
        redirectUriAfterRegistration:
          type: string
          description: URL the user is redirected to after registration.
          example: https://app.example.com/welcome
        redirectUriAfterResetPassword:
          type: string
          description: URL the user is redirected to after a password reset.
          example: https://app.example.com/signin
        rememberMe:
          type: boolean
          default: false
          description: Whether users can remain logged in for a fixed duration (remember-me).
        rememberMeDuration:
          type: integer
          format: int32
          description: "Duration, in seconds, for which a remembered session stays\
            \ valid."
          example: 604800
        resetPasswordConfirmIdentity:
          type: boolean
          default: false
          description: Whether the user must confirm their identity before resetting
            a password.
        resetPasswordCustomForm:
          type: boolean
          default: false
          description: Whether a custom form is used for the password-reset step.
        resetPasswordCustomFormFields:
          type: array
          description: Custom fields rendered on the password-reset form.
          items:
            $ref: "#/components/schemas/FormField"
        resetPasswordInvalidateTokens:
          type: boolean
          default: false
          description: Whether existing tokens are invalidated when the password is
            reset.
        sendRecoverAccountEmail:
          type: boolean
          default: false
          description: Whether to send an account-recovery email.
        sendVerifyRegistrationAccountEmail:
          type: boolean
          default: false
          description: Whether to send a registration-verification email.
      title: Account settings
    AutomationAdvancedSettings:
      type: object
      description: Advanced application settings.
      properties:
        flowsInherited:
          type: boolean
          default: true
          description: Whether the domain flows are executed for this application
            in addition to its own flows.
        skipConsent:
          type: boolean
          default: false
          description: "Whether the user consent page is skipped: requested scopes\
            \ are granted without asking the user."
      title: Advanced settings
    AutomationApplication:
      type: object
      description: "An application (OAuth 2.0 / OIDC client) managed under a domain\
        \ by the Automation API. The key field is the stable, immutable identity used\
        \ for idempotent create-or-update."
      properties:
        certificate:
          type: string
          description: "Certificate signing the tokens: the key of a certificate of\
            \ the domain, or id:<uuid>. The reference is not checked against existing\
            \ certificates: it can name one created after the application or since\
            \ deleted, and resolves whenever that certificate exists."
          example: signing-cert
        clientId:
          type: string
          description: "OAuth 2.0 client identifier. Generated when omitted on creation.\
            \ Immutable once set: a different value on update is rejected with 400,\
            \ an omitted one keeps the current value. Must be unique within the domain."
          example: mobile-app-client
        createdAt:
          type: string
          format: date-time
          description: "Creation timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
        description:
          type: string
          description: Description of the application.
          example: Customer mobile application
        dryRunErrors:
          type: array
          description: Validation errors returned when dryRun is true. Absent when
            validation succeeds.
          items:
            $ref: "#/components/schemas/DryRunError"
          readOnly: true
        enabled:
          type: boolean
          default: true
          description: Whether the application is enabled. Disabling it revokes its
            tokens.
        identityProviders:
          type: array
          description: Identity providers users can authenticate with on this application.
          items:
            $ref: "#/components/schemas/AutomationApplicationIdentityProvider"
        key:
          type: string
          description: "Stable, immutable identifier for the application within its\
            \ domain. Lowercase alphanumeric and hyphens, starting and ending with\
            \ an alphanumeric character. Used to identify the application on create-or-update."
          example: mobile-app
          maxLength: 255
          minLength: 1
          title: Key
        kind:
          type: string
          description: "Agent persona. Required when type is agent, rejected otherwise."
          enum:
          - USER_EMBEDDED
          - HOSTED_DELEGATED
          - AUTONOMOUS
        metadata:
          type: object
          additionalProperties:
            type: object
            description: Free-form metadata of the application.
            example:
              team: mobile
          description: Free-form metadata of the application.
          example:
            team: mobile
        name:
          type: string
          description: Human-readable name of the application. Also used as the OAuth
            2.0 client name.
          example: Mobile app
          maxLength: 255
          minLength: 1
        settings:
          $ref: "#/components/schemas/AutomationApplicationSettings"
        template:
          type: boolean
          default: false
          description: Whether the application is a registration template for dynamic
            client registration rather than an active application.
        type:
          type: string
          description: "Application type. It drives the computed OAuth 2.0 settings.\
            \ Can be changed, except to or from agent: such a change is rejected with\
            \ 400 (delete and recreate the application). Changing the type resets\
            \ grantTypes, responseTypes and tokenEndpointAuthMethod to the new type's\
            \ defaults before the payload applies."
          enum:
          - web
          - native
          - browser
          - service
          - resource_server
          - agent
          example: native
        updatedAt:
          type: string
          format: date-time
          description: "Last-update timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
      required:
      - certificate
      - key
      - name
      - type
      title: Application
    AutomationApplicationFactorSettings:
      type: object
      description: A factor available to the application.
      properties:
        id:
          type: string
          description: "The factor, as id:<uuid> (factors have no Automation API endpoint)."
          example: id:5e8f1c0a-2b3d-4f5e-8a9b-0c1d2e3f4a5b
        selectionRule:
          type: string
          description: "Expression Language rule selecting this factor. When empty,\
            \ the factor is always available."
          example: "{#context.attributes['user'].roles.contains('admin')}"
      required:
      - id
      title: Application factor
    AutomationApplicationIdentityProvider:
      type: object
      description: An identity provider users can authenticate with on this application.
      properties:
        identity:
          type: string
          description: "Reference to an identity provider of the domain: its key,\
            \ or id:<uuid> for one the Automation API does not manage. The reference\
            \ is not checked against existing identity providers: it can name one\
            \ created after the application or since deleted, and resolves whenever\
            \ that identity provider exists."
          example: customer-users
        priority:
          type: integer
          format: int32
          default: 0
          description: "Evaluation order among the application's identity providers:\
            \ lowest first; negative values come last."
        selectionRule:
          type: string
          description: "Expression Language rule selecting this identity provider\
            \ for the current request. When empty, the identity provider is always\
            \ selectable."
          example: "{#request.params['idp'][0] == 'customers'}"
      required:
      - identity
      title: Application identity provider
    AutomationApplicationOAuthSettings:
      type: object
      description: "OAuth 2.0 and OpenID Connect settings of the application. Fields\
        \ described as computed are filled in by AM when omitted. In crossAppAccessSettings,\
        \ trustDomainId and resourceServerId are references by id:<uuid> only. tokenExchangeOAuthSettings,\
        \ when omitted, is inherited from the domain."
      properties:
        accessTokenValiditySeconds:
          type: integer
          format: int32
          default: 7200
          description: "Access token validity, in seconds. Computed (7200) when omitted."
        applicationType:
          type: string
          description: "OIDC application type, computed from the application type:\
            \ native for native applications, web for web, browser and service applications.\
            \ Read-only."
          readOnly: true
        authorizationEncryptedResponseAlg:
          type: string
          description: JWE alg algorithm encrypting the authorization responses (JARM).
        authorizationEncryptedResponseEnc:
          type: string
          description: JWE enc algorithm encrypting the authorization responses (JARM).
        authorizationSignedResponseAlg:
          type: string
          description: JWS algorithm signing the authorization responses (JARM).
        clientName:
          type: string
          description: Name of the client presented to users. Always the application
            name. Read-only.
          readOnly: true
        clientType:
          type: string
          description: "OAuth 2.0 client type, computed from the application type:\
            \ confidential for web and service applications, public for browser and\
            \ native applications and user_embedded agents. Read-only."
          readOnly: true
        clientUri:
          type: string
          description: URL of the application home page.
        contacts:
          type: array
          description: Email addresses of the people responsible for the application.
          example:
          - ops@example.com
          items:
            type: string
            description: Email addresses of the people responsible for the application.
            example: "[\"ops@example.com\"]"
        crossAppAccessSettings:
          $ref: "#/components/schemas/ApplicationCrossAppAccessSettings"
        defaultACRvalues:
          type: array
          description: Default requested Authentication Context Class Reference values.
          items:
            type: string
            description: Default requested Authentication Context Class Reference
              values.
        defaultMaxAge:
          type: integer
          format: int32
          description: "Default maximum authentication age, in seconds."
          example: 3600
        disableRefreshTokenRotation:
          type: boolean
          default: false
          description: "Whether a refresh token stays valid when used, instead of\
            \ being replaced by a new one."
        dpopBoundAccessTokens:
          type: boolean
          default: false
          description: Whether access tokens must be bound to a DPoP proof (RFC 9449).
        enhanceScopesWithUserPermissions:
          type: boolean
          default: false
          description: Whether the permissions of the user roles are added to the
            scopes of the issued tokens.
        forcePKCE:
          type: boolean
          default: false
          description: "Whether the authorization code flow requires PKCE. Computed\
            \ (true) for browser and native applications created without grantTypes,\
            \ and for user_embedded agents."
        forceS256CodeChallengeMethod:
          type: boolean
          default: false
          description: "Whether PKCE requires the S256 code challenge method. Computed\
            \ (true) for browser applications created without grantTypes, and for\
            \ user_embedded agents."
        grantTypes:
          type: array
          description: "OAuth 2.0 grant types the application may use. Computed when\
            \ omitted, from the application type: web authorization_code and password;\
            \ browser and native authorization_code; service client_credentials; resource_server\
            \ adds client_credentials; agent per kind (user_embedded authorization_code;\
            \ hosted_delegated authorization_code, client_credentials and token exchange;\
            \ autonomous client_credentials and token exchange)."
          example:
          - authorization_code
          - refresh_token
          items:
            type: string
            description: "OAuth 2.0 grant types the application may use. Computed\
              \ when omitted, from the application type: web authorization_code and\
              \ password; browser and native authorization_code; service client_credentials;\
              \ resource_server adds client_credentials; agent per kind (user_embedded\
              \ authorization_code; hosted_delegated authorization_code, client_credentials\
              \ and token exchange; autonomous client_credentials and token exchange)."
            example: "[\"authorization_code\",\"refresh_token\"]"
        idJagValiditySeconds:
          type: integer
          format: int32
          default: 300
          description: "Validity, in seconds, of the identity assertion authorization\
            \ grants (ID-JAG) issued to the application. Computed (300) when omitted."
        idTokenEncryptedResponseAlg:
          type: string
          description: JWE alg algorithm encrypting the ID tokens issued to the application.
        idTokenEncryptedResponseEnc:
          type: string
          description: JWE enc algorithm encrypting the ID tokens issued to the application.
        idTokenSignedResponseAlg:
          type: string
          description: JWS algorithm signing the ID tokens issued to the application.
        idTokenValiditySeconds:
          type: integer
          format: int32
          default: 14400
          description: "ID token validity, in seconds. Computed (14400) when omitted."
        initiateLoginUri:
          type: string
          description: "URI, using the https scheme, a third party can use to initiate\
            \ a login by the application."
          example: https://app.example.com/login
        jwks:
          type: object
          additionalProperties:
            type: object
            description: "JSON Web Key Set of the application passed by value (RFC\
              \ 7517 section 5): an object with a keys array of JWKs. Same use as\
              \ jwksUri, which it excludes."
            example:
              keys:
              - e: AQAB
                kid: app-key
                kty: RSA
                "n": 0vx7...
                use: sig
          description: "JSON Web Key Set of the application passed by value (RFC 7517\
            \ section 5): an object with a keys array of JWKs. Same use as jwksUri,\
            \ which it excludes."
          example:
            keys:
            - e: AQAB
              kid: app-key
              kty: RSA
              "n": 0vx7...
              use: sig
        jwksUri:
          type: string
          description: "URL of the application JSON Web Key Set, holding the keys\
            \ used to verify its signatures. Mutually exclusive with jwks."
          example: https://app.example.com/.well-known/jwks.json
        lightweightJwtSettings:
          $ref: "#/components/schemas/ApplicationLightweightJwtSettings"
        logoUri:
          type: string
          description: "URL of the application logo, displayed to users."
        optInScopeSelection:
          type: boolean
          default: true
          description: "When true, users must explicitly select each scope on the\
            \ consent page; when false, all requested scopes are preselected and users\
            \ can deselect them. Computed (true) when omitted."
        policyUri:
          type: string
          description: URL of the application policy on the use of profile data.
        postLogoutRedirectUris:
          type: array
          description: URLs the user may be redirected to after logout (post_logout_redirect_uri).
          example:
          - https://app.example.com/logged-out
          items:
            type: string
            description: URLs the user may be redirected to after logout (post_logout_redirect_uri).
            example: "[\"https://app.example.com/logged-out\"]"
        redirectUris:
          type: array
          description: Redirection URIs. The redirect_uri of an authorization request
            must match one of them. At least one is required for the authorization_code
            and implicit grants.
          example:
          - https://app.example.com/callback
          items:
            type: string
            description: Redirection URIs. The redirect_uri of an authorization request
              must match one of them. At least one is required for the authorization_code
              and implicit grants.
            example: "[\"https://app.example.com/callback\"]"
        refreshTokenValiditySeconds:
          type: integer
          format: int32
          default: 14400
          description: "Refresh token validity, in seconds. Computed (14400) when\
            \ omitted."
        requestObjectEncryptionAlg:
          type: string
          description: JWE alg algorithm the application may encrypt its request objects
            with.
        requestObjectEncryptionEnc:
          type: string
          description: JWE enc algorithm the application may encrypt its request objects
            with.
        requestObjectSigningAlg:
          type: string
          description: JWS algorithm the application signs its request objects with.
        requestUris:
          type: array
          description: request_uri values pre-registered by the application.
          items:
            type: string
            description: request_uri values pre-registered by the application.
        requireAuthTime:
          type: boolean
          default: false
          description: Whether the auth_time claim is required in the ID token.
        responseTypes:
          type: array
          description: "OAuth 2.0 / OIDC response types the application may use. Computed\
            \ from grantTypes when omitted: authorization_code adds code, implicit\
            \ adds token and id_token."
          example:
          - code
          items:
            type: string
            description: "OAuth 2.0 / OIDC response types the application may use.\
              \ Computed from grantTypes when omitted: authorization_code adds code,\
              \ implicit adds token and id_token."
            example: "[\"code\"]"
        scopeSettings:
          type: array
          description: "Scopes the application can request. Each scope must exist\
            \ in the domain, otherwise the request is rejected with 400. Resource\
            \ server applications always get the uma_protection scope."
          items:
            $ref: "#/components/schemas/AutomationScopeSettings"
        sectorIdentifierUri:
          type: string
          description: "URL, using the https scheme, used to compute pairwise subject\
            \ identifiers."
        silentReAuthentication:
          type: boolean
          default: false
          description: Whether the id_token_hint parameter can be used to re-authenticate
            the user silently.
        singleSignOut:
          type: boolean
          default: false
          description: Whether logout also calls the end_session_endpoint of the external
            OIDC provider the user authenticated with.
        subjectType:
          type: string
          description: "Subject identifier type of the responses: public or pairwise."
          example: public
        tlsClientAuthSanDns:
          type: string
          description: "Expected dNSName subject alternative name of the client certificate,\
            \ for the tls_client_auth method."
        tlsClientAuthSanEmail:
          type: string
          description: "Expected rfc822Name subject alternative name of the client\
            \ certificate, for the tls_client_auth method."
        tlsClientAuthSanIp:
          type: string
          description: "Expected iPAddress subject alternative name of the client\
            \ certificate, for the tls_client_auth method."
        tlsClientAuthSanUri:
          type: string
          description: "Expected uniformResourceIdentifier subject alternative name\
            \ of the client certificate, for the tls_client_auth method."
        tlsClientAuthSubjectDn:
          type: string
          description: "Expected subject distinguished name of the client certificate,\
            \ for the tls_client_auth method."
          example: CN=app.example.com
        tlsClientCertificateBoundAccessTokens:
          type: boolean
          default: false
          description: Whether access tokens are bound to the client certificate (RFC
            8705).
        tokenCustomClaims:
          type: array
          description: Custom claims added to the issued tokens.
          items:
            $ref: "#/components/schemas/AutomationTokenClaim"
        tokenEndpointAuthMethod:
          type: string
          description: "Client authentication method at the token endpoint: client_secret_basic,\
            \ client_secret_post, client_secret_jwt, private_key_jwt, tls_client_auth,\
            \ self_signed_tls_client_auth or none. Computed when omitted: client_secret_basic\
            \ on creation, none for browser and native applications created without\
            \ grantTypes, per kind for agents (user_embedded none; hosted_delegated\
            \ and autonomous private_key_jwt)."
          example: client_secret_basic
        tokenEndpointAuthSigningAlg:
          type: string
          description: "JWS algorithm the application signs its authentication JWT\
            \ with, for the private_key_jwt and client_secret_jwt methods."
          example: RS256
        tokenExchangeOAuthSettings:
          $ref: "#/components/schemas/TokenExchangeOAuthSettings"
        tosUri:
          type: string
          description: URL of the application terms of service.
        userinfoCustomClaims:
          type: array
          description: Custom claims added to the UserInfo responses.
          items:
            $ref: "#/components/schemas/AutomationUserInfoClaim"
        userinfoEncryptedResponseAlg:
          type: string
          description: JWE alg algorithm encrypting the UserInfo responses.
        userinfoEncryptedResponseEnc:
          type: string
          description: JWE enc algorithm encrypting the UserInfo responses.
        userinfoSignedResponseAlg:
          type: string
          description: JWS algorithm signing the UserInfo responses.
      title: Application OAuth 2.0 / OIDC settings
    AutomationApplicationSAMLSettings:
      type: object
      description: Settings of the application acting as a SAML 2.0 service provider
        (SP).
      properties:
        assertionAttributes:
          type: array
          description: "Custom attributes of the SAML assertion. When not empty, they\
            \ replace the default attribute set."
          items:
            $ref: "#/components/schemas/AutomationSamlAssertionAttribute"
        assertionValiditySeconds:
          type: integer
          format: int32
          description: "Validity, in seconds, of the issued assertion. When absent,\
            \ the IdP default applies. Used when includeAssertionConditions is true."
          example: 300
        attributeConsumeServiceUrl:
          type: string
          description: SP endpoint the IdP sends SAML responses to (Assertion Consumer
            Service URL).
          example: https://app.example.com/saml/acs
        audiences:
          type: array
          description: Audience URIs added to the SP entity ID in the AudienceRestriction.
            Used when includeAssertionConditions is true.
          items:
            type: string
            description: Audience URIs added to the SP entity ID in the AudienceRestriction.
              Used when includeAssertionConditions is true.
        certificate:
          type: string
          description: "The SP's PEM-encoded public key certificate, used by the IdP\
            \ to verify SAML requests and, when assertions are encrypted, to wrap\
            \ the symmetric key. Required when wantAssertionsEncrypted is true."
        dataEncryptionAlgorithm:
          type: string
          description: Data encryption algorithm URI of encrypted assertions (XML
            Encryption EncryptedData).
          example: http://www.w3.org/2009/xmlenc11#aes256-gcm
        entityId:
          type: string
          description: URL or URN that uniquely identifies the SP (the SAML entity
            ID).
          example: https://app.example.com
        includeAssertionConditions:
          type: boolean
          default: false
          description: "Whether assertions carry Conditions (validity time bounds\
            \ and audience restriction), configured by the fields below."
        keyTransportEncryptionAlgorithm:
          type: string
          description: Key transport algorithm URI of encrypted assertions (XML Encryption
            EncryptedKey).
          example: http://www.w3.org/2009/xmlenc11#rsa-oaep
        nameIdMapping:
          type: string
          description: "Expression Language expression producing the NameID of the\
            \ SAML response. When empty, the internal user id is used, or the user's\
            \ email when the SP requests the email format."
          example: "{#context.attributes['user'].username}"
        notBeforeTimeSkewSeconds:
          type: integer
          format: int32
          description: "Clock skew, in seconds, subtracted from NotBefore."
          example: 30
        notOnOrAfterTimeSkewSeconds:
          type: integer
          format: int32
          description: "Clock skew, in seconds, added to NotOnOrAfter."
          example: 30
        responseBinding:
          type: string
          default: urn:oasis:names:tc:SAML:2.0:bindings:custom:Initial-Request
          description: Binding used to send SAML responses to the SP. The default
            answers with the binding of the initial request.
        singleLogoutServiceUrl:
          type: string
          description: SP endpoint the IdP redirects to after a single logout.
          example: https://app.example.com/saml/logout
        wantAssertionsEncrypted:
          type: boolean
          default: false
          description: Whether the SP requires encrypted SAML assertions.
        wantAssertionsSigned:
          type: boolean
          default: false
          description: Whether the SP requires signed SAML assertions.
        wantResponseSigned:
          type: boolean
          default: true
          description: Whether the SP requires signed SAML responses.
      title: Application SAML 2.0 settings
    AutomationApplicationSettings:
      type: object
      description: "Settings of the application. The login, account and cookieSettings\
        \ blocks, when omitted, are inherited from the domain; any other omitted block\
        \ is unset."
      properties:
        account:
          $ref: "#/components/schemas/AutomationAccountSettings"
        advanced:
          $ref: "#/components/schemas/AutomationAdvancedSettings"
        cookieSettings:
          $ref: "#/components/schemas/AutomationCookieSettings"
        login:
          $ref: "#/components/schemas/LoginSettings"
        mfa:
          $ref: "#/components/schemas/AutomationMfaSettings"
        oauth:
          $ref: "#/components/schemas/AutomationApplicationOAuthSettings"
        riskAssessment:
          $ref: "#/components/schemas/AutomationRiskAssessmentSettings"
        saml:
          $ref: "#/components/schemas/AutomationApplicationSAMLSettings"
        secretExpirationSettings:
          $ref: "#/components/schemas/SecretExpirationSettings"
        workloadIdentitySettings:
          $ref: "#/components/schemas/AutomationWorkloadIdentitySettings"
      title: Application settings
    AutomationAssessmentSettings:
      type: object
      description: Settings of one risk assessment.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether this assessment is enabled.
        thresholds:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "Score threshold of each risk level: an assessment scoring\
            \ at or above a threshold reaches that level."
          example:
            HIGH: 1.0
      title: Assessment settings
    AutomationCIBASettings:
      type: object
      description: "Client-Initiated Backchannel Authentication (CIBA) settings for\
        \ the domain. CIBA lets a relying party initiate end-user authentication from\
        \ a separate consumption device, without redirecting the user through the\
        \ browser. Authentication device notifiers are not managed by the Automation\
        \ API and are not exposed here."
      properties:
        authReqExpiry:
          type: integer
          format: int32
          default: 600
          description: "Default validity period, in seconds, of the issued auth_req_id."
        bindingMessageLength:
          type: integer
          format: int32
          default: 256
          description: Maximum number of characters accepted for the binding_message
            parameter.
        enabled:
          type: boolean
          default: false
          description: Whether Client-Initiated Backchannel Authentication is enabled
            for the domain.
        tokenReqInterval:
          type: integer
          format: int32
          default: 5
          description: "Minimum delay, in seconds, that a client must wait between\
            \ two polls of the token endpoint for the same auth_req_id (POLL or PING\
            \ delivery mode)."
      title: CIBA settings
    AutomationCertificate:
      type: object
      description: "A certificate managed under a domain by the Automation API. The\
        \ key field is the stable, immutable identity used for idempotent create-or-update."
      properties:
        configuration:
          type: string
          description: "Plugin-specific configuration as a JSON-encoded string. Its\
            \ shape is defined by the selected certificate type. Sensitive values,\
            \ as flagged by the plugin, are returned as ******** in every response;\
            \ an unset sensitive value is omitted. Sending ******** back on update\
            \ keeps the stored value; sending it on create is rejected. The uploaded\
            \ keystore file is masked too; sending ******** back keeps it."
          example: "{\"jks\":{\"content\":\"...\",\"name\":\"keystore.jks\"},\"storepass\"\
            :\"secret\",\"alias\":\"mykey\",\"keypass\":\"secret\"}"
        createdAt:
          type: string
          format: date-time
          description: "Creation timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
        dryRunErrors:
          type: array
          description: Validation errors returned when dryRun is true. Absent when
            validation succeeds.
          items:
            $ref: "#/components/schemas/DryRunError"
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          description: "Expiry timestamp (ISO-8601 / RFC 3339, UTC), when known for\
            \ the certificate type. Read-only."
          readOnly: true
        key:
          type: string
          description: "Stable, immutable identifier for the certificate within its\
            \ domain. Lowercase alphanumeric and hyphens, starting and ending with\
            \ an alphanumeric character. Used to identify the certificate on create-or-update."
          example: signing-cert
          maxLength: 255
          minLength: 1
          title: Key
        name:
          type: string
          description: Human-readable name of the certificate.
          example: Signing certificate
          maxLength: 255
          minLength: 1
        system:
          type: boolean
          default: false
          description: "Whether this is the domain's system certificate. Immutable\
            \ after creation. When true, only key is required; the certificate is\
            \ built from the domains.certificates.default.* system settings and the\
            \ name, type, and configuration fields are ignored."
        type:
          type: string
          description: Certificate plugin type identifier. Immutable after creation.
          example: javakeystore-am-certificate
          maxLength: 2147483647
          minLength: 1
        updatedAt:
          type: string
          format: date-time
          description: "Last-update timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
      required:
      - key
      title: Certificate
    AutomationCertificateSettings:
      type: object
      description: Domain-level certificate settings.
      properties:
        fallbackCertificate:
          type: string
          description: "Key of a certificate managed under this domain, used as the\
            \ fallback certificate when a client does not specify one. The reference\
            \ is not checked against existing certificates: it can name one created\
            \ after the domain or since deleted, and resolves whenever a certificate\
            \ with that key exists."
          example: default
      title: Certificate settings
    AutomationChallengeSettings:
      type: object
      description: When users are challenged for a second factor.
      properties:
        active:
          type: boolean
          default: false
          description: Whether users are challenged for a second factor.
        challengeRule:
          type: string
          description: "Expression Language rule of a conditional challenge: when\
            \ it evaluates to true, the challenge is skipped."
          example: "{#context.attributes['geoip']['country_iso_code'] == 'FR'}"
        type:
          type: string
          description: "required: always challenge. conditional: challenge unless\
            \ challengeRule evaluates to true. risk_based: challenge according to\
            \ the risk assessment."
          enum:
          - required
          - conditional
          - risk_based
          example: required
      title: Challenge settings
    AutomationClientRegistrationSettings:
      type: object
      description: OpenID Connect Dynamic Client Registration configuration for the
        domain.
      properties:
        allowHttpSchemeRedirectUri:
          type: boolean
          default: false
          description: Whether the unsecured http scheme is permitted in redirect
            URIs.
        allowLocalhostRedirectUri:
          type: boolean
          default: false
          description: Whether localhost is permitted as a redirect URI host.
        allowRedirectUriParamsExpressionLanguage:
          type: boolean
          default: false
          description: Whether expression language is permitted in redirect URI parameters.
        allowWildCardRedirectUri:
          type: boolean
          default: false
          description: Whether wildcards are permitted in redirect URIs.
        allowedScopes:
          type: array
          description: Scopes permitted on client registration requests when the allowed
            list is enabled.
          items:
            type: string
            description: Scopes permitted on client registration requests when the
              allowed list is enabled.
        allowedScopesEnabled:
          type: boolean
          default: false
          description: Whether registered client scopes are restricted to an allowed
            list.
        clientTemplateEnabled:
          type: boolean
          default: false
          description: Whether a client may be used as a template for dynamic client
            registration.
        defaultScopes:
          type: array
          description: Default scopes added to every client registration request.
          items:
            type: string
            description: Default scopes added to every client registration request.
        dynamicClientRegistrationEnabled:
          type: boolean
          default: false
          description: Whether Dynamic Client Registration is enabled for the domain.
        openDynamicClientRegistrationEnabled:
          type: boolean
          default: false
          description: Whether open (unauthenticated) Dynamic Client Registration
            is enabled for the domain.
      title: Client registration settings
    AutomationCookieSettings:
      type: object
      description: Session cookie settings of the application.
      properties:
        inherited:
          type: boolean
          default: true
          description: "Whether the cookie settings are inherited from the domain.\
            \ When true, the other fields are ignored."
        session:
          $ref: "#/components/schemas/AutomationSessionSettings"
      title: Cookie settings
    AutomationDataPlane:
      type: object
      description: "A data plane managed by the Automation API. Data planes store\
        \ the runtime data of the domains bound to them. The id field is the stable,\
        \ immutable identity used for idempotent create-or-update."
      properties:
        configuration:
          type: object
          description: "Connection settings. Write-only: it can hold credentials."
          example:
            mongodb:
              dbname: gravitee-am-acme
              host: mongo
              port: 27017
          writeOnly: true
        createdAt:
          type: string
          format: date-time
          description: "Creation timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
        database:
          type: string
          description: Name of the database the configuration points at. Read-only.
          example: gravitee-am-acme
          readOnly: true
        environmentId:
          type: string
          description: Identifier of the environment the data plane belongs to. Read-only.
          example: DEFAULT
          readOnly: true
        gatewayUrl:
          type: string
          description: Base URL of the gateway serving the domains bound to this data
            plane. Must be an absolute http(s) URL with a lowercase scheme; omitted
            or empty leaves it unset.
          example: https://gateway-eu.example.com
          maxLength: 256
          minLength: 0
          pattern: ^\s*$|^https?://.+
        hosts:
          type: array
          description: "Hosts the configuration points at, as host:port. Read-only."
          example:
          - mongo:27017
          items:
            type: string
            description: "Hosts the configuration points at, as host:port. Read-only."
            example: "[\"mongo:27017\"]"
            readOnly: true
          readOnly: true
        id:
          type: string
          description: "Stable, immutable identifier for the data plane within its\
            \ environment. Lowercase alphanumeric and hyphens, starting and ending\
            \ with an alphanumeric character. This is the value a domain's dataPlaneId\
            \ refers to."
          example: acme-eu
          maxLength: 64
          minLength: 1
        name:
          type: string
          description: Human-readable name of the data plane.
          example: ACME EU data plane
          maxLength: 128
          minLength: 1
        organizationId:
          type: string
          description: Identifier of the organization the data plane belongs to. Read-only.
          example: DEFAULT
          readOnly: true
        type:
          type: string
          description: "Data plane plugin type identifier, matching the dataplane-am-<type>\
            \ plugin. Immutable after creation."
          example: mongodb
        updatedAt:
          type: string
          format: date-time
          description: "Last-update timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
      required:
      - id
      title: Data plane
    AutomationDomain:
      type: object
      description: "A security domain managed by the Automation API. The key field\
        \ is the stable, immutable identity used for idempotent create-or-update.\
        \ Certificates, identity providers, and reporters are not embedded; they are\
        \ managed via the domain's sub-resource endpoints and referenced here by key."
      properties:
        accountSettings:
          $ref: "#/components/schemas/AutomationAccountSettings"
        alertEnabled:
          type: boolean
          default: false
          description: Whether alerting is enabled for the domain.
        certificateSettings:
          $ref: "#/components/schemas/AutomationCertificateSettings"
        corsSettings:
          $ref: "#/components/schemas/CorsSettings"
        createdAt:
          type: string
          format: date-time
          description: "Creation timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
        dataPlaneId:
          type: string
          description: "Identifier of the data plane this domain is connected to.\
            \ Optional at creation and resolved from the environment's data planes\
            \ when omitted. Immutable afterwards: an apply that names a different\
            \ one is rejected."
          example: default
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: Human-readable description of the domain.
          example: An example authentication domain
        dryRunErrors:
          type: array
          description: Validation errors returned when dryRun is true. Absent when
            validation succeeds.
          items:
            $ref: "#/components/schemas/DryRunError"
          readOnly: true
        enabled:
          type: boolean
          default: true
          description: Whether the domain handles incoming authentication and authorization
            requests.
        key:
          type: string
          description: "Stable, immutable identifier for the domain within its environment.\
            \ Lowercase alphanumeric and hyphens, starting and ending with an alphanumeric\
            \ character. Used to identify the domain on create-or-update."
          example: example-domain
          maxLength: 255
          minLength: 1
          title: Key
        keyRetrievalSettings:
          $ref: "#/components/schemas/KeyRetrievalSettings"
        loginSettings:
          $ref: "#/components/schemas/LoginSettings"
        master:
          type: boolean
          default: false
          description: Whether this is the master domain of its environment. A master
            domain may perform cross-domain token introspection.
        name:
          type: string
          description: Human-readable name of the domain.
          example: Example domain
          maxLength: 255
          minLength: 1
        oidc:
          $ref: "#/components/schemas/AutomationOidcSettings"
        passwordSettings:
          $ref: "#/components/schemas/PasswordSettings"
        path:
          type: string
          description: "Context path the domain is served under, relative to the gateway.\
            \ Must start with a slash."
          example: /example-domain
          maxLength: 255
          minLength: 1
          pattern: ^/.*
        saml:
          $ref: "#/components/schemas/AutomationSamlSettings"
        scim:
          $ref: "#/components/schemas/SCIMSettings"
        secretExpirationSettings:
          $ref: "#/components/schemas/SecretExpirationSettings"
        selfServiceAccountManagementSettings:
          $ref: "#/components/schemas/SelfServiceAccountManagementSettings"
        tags:
          type: array
          description: Sharding tags that control which gateways deploy this domain.
          example:
          - eu
          - production
          items:
            type: string
            description: Sharding tags that control which gateways deploy this domain.
            example: "[\"eu\",\"production\"]"
          uniqueItems: true
        tokenExchangeSettings:
          $ref: "#/components/schemas/TokenExchangeSettings"
        uma:
          $ref: "#/components/schemas/UMASettings"
        updatedAt:
          type: string
          format: date-time
          description: "Last-update timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
        vhostMode:
          type: boolean
          default: false
          description: "Whether the domain is exposed through its virtual hosts rather\
            \ than the default context path. When true, vhosts must be supplied."
        vhosts:
          type: array
          description: "Virtual hosts the domain is exposed on, overriding the default\
            \ context path."
          items:
            $ref: "#/components/schemas/VirtualHost"
        webAuthnSettings:
          $ref: "#/components/schemas/WebAuthnSettings"
        webProtectionSettings:
          $ref: "#/components/schemas/WebProtectionSettings"
      required:
      - key
      - name
      - path
      title: Domain
    AutomationEnrollSettings:
      type: object
      description: When users are asked to enroll a factor.
      properties:
        active:
          type: boolean
          default: false
          description: Whether users are asked to enroll a factor.
        enrollmentRule:
          type: string
          description: "Expression Language rule of a conditional enrollment: when\
            \ it evaluates to true, the enrollment is skipped."
          example: "{#context.attributes['user'].roles.contains('guest')}"
        enrollmentSkipActive:
          type: boolean
          default: false
          description: Whether users can skip the enrollment.
        enrollmentSkipRule:
          type: string
          description: "Expression Language rule: when it evaluates to true, users\
            \ can skip the enrollment."
        forceEnrollment:
          type: boolean
          description: Whether users must enroll a factor.
        skipTimeSeconds:
          type: integer
          format: int64
          description: "Duration, in seconds, during which a skipped enrollment is\
            \ not asked again."
          example: 36000
        type:
          type: string
          description: "optional: users can skip the enrollment. required: users must\
            \ enroll. conditional: enrollment required unless enrollmentRule evaluates\
            \ to true."
          enum:
          - optional
          - required
          - conditional
          example: required
      title: Enroll settings
    AutomationEnrollmentSettings:
      type: object
      deprecated: true
      description: "Deprecated: use enroll. Legacy enrollment settings."
      properties:
        forceEnrollment:
          type: boolean
          description: Whether users must enroll a factor.
        skipTimeSeconds:
          type: integer
          format: int64
          description: "Duration, in seconds, during which users can skip the enrollment."
          example: 36000
      title: Enrollment settings (deprecated)
    AutomationFactorSettings:
      type: object
      description: Factors offered to the users of the application.
      properties:
        applicationFactors:
          type: array
          description: Factors available to the application.
          items:
            $ref: "#/components/schemas/AutomationApplicationFactorSettings"
        defaultFactorId:
          type: string
          description: "Factor proposed first, as id:<uuid> (factors have no Automation\
            \ API endpoint)."
          example: id:5e8f1c0a-2b3d-4f5e-8a9b-0c1d2e3f4a5b
      title: Factor settings
    AutomationIdentityProvider:
      type: object
      description: "An identity provider managed under a domain by the Automation\
        \ API. The key field is the stable, immutable identity used for idempotent\
        \ create-or-update."
      properties:
        configuration:
          type: string
          description: "Plugin-specific configuration as a JSON-encoded string. Its\
            \ shape is defined by the selected identity provider type. Sensitive values,\
            \ as flagged by the plugin, are returned as ******** in every response;\
            \ an unset sensitive value is omitted. Sending ******** back on update\
            \ keeps the stored value; sending it on create is rejected."
          example: "{\"users\":[{\"username\":\"admin\",\"password\":\"...\"}]}"
        createdAt:
          type: string
          format: date-time
          description: "Creation timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
        domainWhitelist:
          type: array
          default: []
          description: "Email domains allowed to authenticate through this identity\
            \ provider. When set, users whose email domain is not listed are rejected."
          example:
          - example.com
          items:
            type: string
        dryRunErrors:
          type: array
          description: Validation errors returned when dryRun is true. Absent when
            validation succeeds.
          items:
            $ref: "#/components/schemas/DryRunError"
          readOnly: true
        groupMapper:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          default: {}
          description: "Group mapper: assigns AM groups based on provider attribute\
            \ values. Each entry maps a group to the user attribute expressions that\
            \ grant it."
        key:
          type: string
          description: "Stable, immutable identifier for the identity provider within\
            \ its domain. Lowercase alphanumeric and hyphens, starting and ending\
            \ with an alphanumeric character. Used to identify the identity provider\
            \ on create-or-update."
          example: corporate-ldap
          maxLength: 255
          minLength: 1
          title: Key
        mappers:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: "Attribute mappers: maps provider claims to AM user profile\
            \ attributes."
          example:
            email: email
            sub: username
        name:
          type: string
          description: Human-readable name of the identity provider.
          example: Corporate LDAP
          maxLength: 255
          minLength: 1
        roleMapper:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          default: {}
          description: "Role mapper: assigns AM roles based on provider attribute\
            \ values. Each entry maps a role to the user attribute expressions that\
            \ grant it."
        system:
          type: boolean
          default: false
          description: "Whether this is the domain's system identity provider. Immutable\
            \ after creation. When true, only key is required; the identity provider\
            \ is built from the domains.identities.default.* system settings and the\
            \ name, type, and configuration fields are ignored."
        type:
          type: string
          description: Identity provider plugin type identifier. Immutable after creation.
          example: inline-am-idp
        updatedAt:
          type: string
          format: date-time
          description: "Last-update timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
      required:
      - key
      title: Identity provider
    AutomationMfaSettings:
      type: object
      description: Multi-factor authentication settings of the application.
      properties:
        adaptiveAuthenticationRule:
          type: string
          deprecated: true
          description: "Deprecated: use challenge.challengeRule. Expression Language\
            \ rule of the adaptive authentication."
        challenge:
          $ref: "#/components/schemas/AutomationChallengeSettings"
        enroll:
          $ref: "#/components/schemas/AutomationEnrollSettings"
        enrollment:
          $ref: "#/components/schemas/AutomationEnrollmentSettings"
        factor:
          $ref: "#/components/schemas/AutomationFactorSettings"
        loginRule:
          type: string
          description: "Legacy MFA login rule, kept for round-trip fidelity. Use challenge\
            \ and enroll to configure when MFA applies."
        rememberDevice:
          $ref: "#/components/schemas/AutomationRememberDeviceSettings"
        stepUpAuthentication:
          $ref: "#/components/schemas/AutomationStepUpAuthenticationSettings"
        stepUpAuthenticationRule:
          type: string
          deprecated: true
          description: "Deprecated: use stepUpAuthentication. Expression Language\
            \ rule triggering step-up authentication."
      title: MFA settings
    AutomationOidcSettings:
      type: object
      description: OpenID Connect settings for the domain. CIMD (client identity metadata
        document) settings are not exposed by the Automation API and are reset on
        update.
      properties:
        cibaSettings:
          $ref: "#/components/schemas/AutomationCIBASettings"
        clientRegistrationSettings:
          $ref: "#/components/schemas/AutomationClientRegistrationSettings"
        postLogoutRedirectUris:
          type: array
          description: URLs the user may be redirected to after sign-out (post_logout_redirect_uri).
          items:
            type: string
            description: URLs the user may be redirected to after sign-out (post_logout_redirect_uri).
        redirectUriStrictMatching:
          type: boolean
          default: false
          description: Whether redirect_uri and post_logout_redirect_uri values are
            matched strictly during OpenID Connect flows.
        requestUris:
          type: array
          description: Allowed request_uri values for passing OpenID Connect request
            objects by reference.
          items:
            type: string
            description: Allowed request_uri values for passing OpenID Connect request
              objects by reference.
        securityProfileSettings:
          $ref: "#/components/schemas/SecurityProfileSettings"
        workloadIdentitySettings:
          $ref: "#/components/schemas/SpiffeDomainSettings"
      title: OpenID Connect settings
    AutomationRememberDeviceSettings:
      type: object
      description: "Remember device: skips the MFA challenge on a device already used\
        \ to authenticate."
      properties:
        active:
          type: boolean
          default: false
          description: Whether remember device is enabled.
        deviceIdentifierId:
          type: string
          description: "Device identifier used to recognize devices, as id:<uuid>\
            \ (device identifiers have no Automation API endpoint)."
          example: id:5e8f1c0a-2b3d-4f5e-8a9b-0c1d2e3f4a5b
        expirationTimeSeconds:
          type: integer
          format: int64
          description: "Duration, in seconds, for which a device is remembered."
          example: 36000
        skipRememberDevice:
          type: boolean
          default: false
          description: "Only used with a conditional MFA challenge: when true, remember\
            \ device is not applied when the MFA condition evaluates to no risk."
      title: Remember device settings
    AutomationReporter:
      type: object
      description: "A reporter managed under a domain by the Automation API. Reporters\
        \ persist audit events to a backend. The key field is the stable, immutable\
        \ identity used for idempotent create-or-update."
      properties:
        attributeMappingEventTypes:
          type: array
          description: Audit event types the attribute mappings apply to. Empty means
            every event type. Ignored when system is true.
          items:
            type: string
            description: Audit event types the attribute mappings apply to. Empty
              means every event type. Ignored when system is true.
          uniqueItems: true
        attributeMappings:
          type: array
          description: Additional attributes exported alongside the regular audit
            payload. Each entry pairs an expression read from the audit context with
            the field name its value is exported under. Ignored when system is true;
            a system reporter exports no additional attributes.
          items:
            $ref: "#/components/schemas/ReporterAttributeMapping"
        configuration:
          type: string
          description: "Plugin-specific configuration as a JSON-encoded string. Its\
            \ shape is defined by the selected reporter type. Sensitive values, as\
            \ flagged by the plugin, are returned as ******** in every response; an\
            \ unset sensitive value is omitted. Sending ******** back on update keeps\
            \ the stored value; sending it on create is rejected."
          example: "{\"bootstrapServers\":\"kafka:9092\",\"topic\":\"audit\"}"
        createdAt:
          type: string
          format: date-time
          description: "Creation timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
        dataType:
          type: string
          description: "Category of data the reporter handles, derived from its type.\
            \ Read-only."
          readOnly: true
        dryRunErrors:
          type: array
          description: Validation errors returned when dryRun is true. Absent when
            validation succeeds.
          items:
            $ref: "#/components/schemas/DryRunError"
          readOnly: true
        enabled:
          type: boolean
          default: true
          description: Whether the reporter is enabled.
        key:
          type: string
          description: "Stable, immutable identifier for the reporter within its domain.\
            \ Lowercase alphanumeric and hyphens, starting and ending with an alphanumeric\
            \ character. Used to identify the reporter on create-or-update."
          example: audit-kafka
          maxLength: 255
          minLength: 1
          title: Key
        name:
          type: string
          description: Human-readable name of the reporter.
          example: Audit events to Kafka
          maxLength: 255
          minLength: 1
        system:
          type: boolean
          default: false
          description: "Whether this is the domain's system reporter. Immutable after\
            \ creation. When true, only key is required; the reporter is built from\
            \ the domains.reporters.default.* and repository system settings and the\
            \ name, type, configuration, attributeMappings and attributeMappingEventTypes\
            \ fields are ignored."
        type:
          type: string
          description: Reporter plugin type identifier. Immutable after creation.
          example: reporter-am-kafka
        updatedAt:
          type: string
          format: date-time
          description: "Last-update timestamp (ISO-8601 / RFC 3339, UTC). Read-only."
          readOnly: true
      required:
      - key
      title: Reporter
    AutomationRiskAssessmentSettings:
      type: object
      description: "Risk assessment of the authentication attempts, used by risk-based\
        \ MFA. Effective only with the Enterprise Edition risk assessment plugin."
      properties:
        deviceAssessment:
          $ref: "#/components/schemas/AutomationAssessmentSettings"
        enabled:
          type: boolean
          default: false
          description: Whether risk assessment is enabled.
        geoVelocityAssessment:
          $ref: "#/components/schemas/AutomationAssessmentSettings"
        ipReputationAssessment:
          $ref: "#/components/schemas/AutomationAssessmentSettings"
      title: Risk assessment settings
    AutomationSamlAssertionAttribute:
      type: object
      description: A custom attribute of the SAML assertion.
      properties:
        name:
          type: string
          description: Name of the SAML attribute.
          example: email
        value:
          type: string
          description: Expression Language expression resolved to the attribute value.
          example: "{#context.attributes['user'].email}"
      required:
      - name
      - value
      title: SAML assertion attribute
    AutomationSamlSettings:
      type: object
      description: Settings for the domain acting as a SAML 2.0 identity provider
        (IdP).
      properties:
        certificate:
          type: string
          description: "Key of a certificate managed under this domain, used to sign\
            \ SAML responses. The reference is not checked against existing certificates:\
            \ it can name one created after the domain or since deleted, and resolves\
            \ whenever a certificate with that key exists."
          example: signing-cert
        enabled:
          type: boolean
          default: false
          description: Whether the domain exposes the SAML 2.0 IdP protocol.
        entityId:
          type: string
          description: URL or URN that uniquely identifies this IdP (the SAML entity
            ID).
          example: https://auth.example.com/saml2/idp/entity
      title: SAML 2.0 settings
    AutomationScopeSettings:
      type: object
      description: "A scope the application can request, with its settings."
      properties:
        defaultScope:
          type: boolean
          default: false
          description: Whether the scope is granted when the authorization request
            carries no scope parameter.
        requiredScope:
          type: boolean
          default: false
          description: Whether the user cannot deselect this scope on the consent
            page.
        scope:
          type: string
          description: "Key of a scope of the domain. The scope must exist, otherwise\
            \ the request is rejected with 400."
          example: openid
        scopeApproval:
          type: integer
          format: int32
          description: "Duration, in seconds, of the user consent to this scope. When\
            \ absent, the domain scope setting applies."
          example: 86400
      required:
      - scope
      title: Scope settings
    AutomationSessionSettings:
      type: object
      description: Session cookie settings.
      properties:
        persistent:
          type: boolean
          default: false
          description: Whether the session cookie is persistent (kept after the browser
            is closed) rather than a session cookie.
      title: Session settings
    AutomationStepUpAuthenticationSettings:
      type: object
      description: "Step-up authentication: asks for MFA again during a session when\
        \ its rule matches."
      properties:
        active:
          type: boolean
          default: false
          description: Whether step-up authentication is enabled.
        stepUpAuthenticationRule:
          type: string
          description: "Expression Language rule: when it evaluates to true, the user\
            \ is challenged again."
          example: "{#request.params['scope'][0].contains('write')}"
      title: Step-up authentication settings
    AutomationTokenClaim:
      type: object
      description: A custom claim added to the tokens issued to the application.
      properties:
        claimName:
          type: string
          description: Name of the claim.
          example: department
        claimValue:
          type: string
          description: "Value of the claim: a literal or an Expression Language expression."
          example: "{#context.attributes['user']['additionalInformation']['department']}"
        tokenType:
          type: string
          description: Token the claim is added to.
          enum:
          - access_token
          - refresh_token
          - id_token
          - id_jag
          example: access_token
      required:
      - claimName
      - claimValue
      - tokenType
      title: Token claim
    AutomationUserInfoClaim:
      type: object
      description: A custom claim added to the UserInfo responses of the application.
      properties:
        claimName:
          type: string
          description: Name of the claim.
          example: department
        claimValue:
          type: string
          description: "Value of the claim: a literal or an Expression Language expression."
          example: "{#context.attributes['user']['additionalInformation']['department']}"
      required:
      - claimName
      - claimValue
      title: UserInfo claim
    AutomationWorkloadIdentitySettings:
      type: object
      description: SPIFFE workload identity the application authenticates with (JWT-SVID
        client authentication).
      properties:
        subject:
          type: string
          description: "SPIFFE ID expected in the SVID sub claim, interpreted per\
            \ subjectMatchMode."
          example: spiffe://prod.example.org/ns/payments/sa/api
        subjectMatchMode:
          type: string
          default: exact
          description: "How subject is matched against the SVID sub claim. exact (default)\
            \ requires equality. prefix is only allowed for hosted_delegated or autonomous\
            \ agent applications: subject must end with / and the SVID sub is accepted\
            \ when it starts with subject; the full SVID SPIFFE ID then becomes the\
            \ per-instance act.sub in minted tokens."
          enum:
          - exact
          - prefix
        trustDomain:
          type: string
          description: Name of the trusted domain this application authenticates against.
          example: prod.example.org
      title: Workload identity settings
    CorsSettings:
      type: object
      description: Cross-Origin Resource Sharing configuration controlling which web
        origins may call the domain's endpoints from a browser.
      properties:
        allowCredentials:
          type: boolean
          default: false
          description: "Whether the browser may send credentials (cookies, authorization\
            \ headers) with cross-origin requests."
        allowedHeaders:
          type: array
          description: Request headers permitted on cross-origin requests.
          example:
          - Authorization
          - Content-Type
          items:
            type: string
            description: Request headers permitted on cross-origin requests.
            example: "[\"Authorization\",\"Content-Type\"]"
          uniqueItems: true
        allowedMethods:
          type: array
          description: HTTP methods permitted on cross-origin requests.
          example:
          - GET
          - POST
          - PUT
          - DELETE
          items:
            type: string
            description: HTTP methods permitted on cross-origin requests.
            example: "[\"GET\",\"POST\",\"PUT\",\"DELETE\"]"
          uniqueItems: true
        allowedOrigins:
          type: array
          description: Origins permitted to make cross-origin requests. Use "*" to
            allow any origin.
          example:
          - https://app.example.com
          items:
            type: string
            description: Origins permitted to make cross-origin requests. Use "*"
              to allow any origin.
            example: "[\"https://app.example.com\"]"
          uniqueItems: true
        enabled:
          type: boolean
          default: false
          description: Whether CORS handling is enabled for the domain when not inherited.
        inherited:
          type: boolean
          default: true
          description: "Whether CORS settings are inherited from the gateway defaults\
            \ (gravitee.yml). When null, legacy behaviour applies: enabled=true overrides\
            \ and enabled=false inherits."
        maxAge:
          type: integer
          format: int32
          default: 86400
          description: "How long, in seconds, a browser may cache the result of a\
            \ preflight request."
      title: CORS settings
    CspSettings:
      type: object
      description: Content Security Policy configuration for the domain's login and
        consent pages.
      properties:
        directives:
          type: array
          description: "CSP directives, one per entry, in the form \"directive-name\
            \ value\". A trailing semicolon is optional. Directive names must be valid\
            \ CSP tokens and must not repeat; values are not interpreted. Directives\
            \ that take no value, such as \"upgrade-insecure-requests\", may be supplied\
            \ on their own. When reportOnly is enabled, a \"report-uri\" or \"report-to\"\
            \ directive is required."
          example:
          - default-src 'self'
          - script-src 'self'
          - upgrade-insecure-requests
          items:
            type: string
            description: "CSP directives, one per entry, in the form \"directive-name\
              \ value\". A trailing semicolon is optional. Directive names must be\
              \ valid CSP tokens and must not repeat; values are not interpreted.\
              \ Directives that take no value, such as \"upgrade-insecure-requests\"\
              , may be supplied on their own. When reportOnly is enabled, a \"report-uri\"\
              \ or \"report-to\" directive is required."
            example: "[\"default-src 'self'\",\"script-src 'self'\",\"upgrade-insecure-requests\"\
              ]"
        enabled:
          type: boolean
          default: false
          description: Whether CSP is enabled for the domain when not inherited.
        inherited:
          type: boolean
          default: true
          description: "Whether CSP settings are inherited from the gateway defaults\
            \ (gravitee.yml). When null, legacy behaviour applies: enabled=true overrides\
            \ and enabled=false inherits."
        reportOnly:
          type: boolean
          default: false
          description: "When true, the policy is delivered as Content-Security-Policy-Report-Only."
        scriptInlineNonce:
          type: boolean
          default: true
          description: Whether inline scripts are allowed via a per-request nonce.
      title: CSP settings
    DryRunError:
      type: object
      description: Validation errors returned when dryRun is true. Absent when validation
        succeeds.
      properties:
        message:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
      readOnly: true
    Error:
      type: object
      description: Error response body returned for failed requests.
      properties:
        http_status:
          type: integer
          format: int32
          description: HTTP status code of the error response.
          example: 400
        message:
          type: string
          description: Human-readable description of the error.
    FormField:
      type: object
      description: "A single field shown on a user-facing form, such as registration."
      properties:
        key:
          type: string
          description: "Identifier of the field, mapped to a user attribute."
          example: email
        label:
          type: string
          description: Label displayed for the field.
          example: Email
        type:
          type: string
          description: Input type of the field.
          example: email
      title: Form field
    IdJagSettings:
      type: object
      description: ID-JAG issuance behavior of token exchange.
      properties:
        laxValidation:
          type: boolean
          default: false
          description: "Lax validation: also accept an access token as the subject\
            \ token. By default only an ID token is accepted. The access token must\
            \ be issued to the requesting client or, when an MCP server requests,\
            \ have that MCP server as audience."
      title: ID-JAG settings
    KeyRetrievalSettings:
      type: object
      description: "Fetch, SSRF and cache limits applied to every trusted domain in\
        \ the security domain."
      properties:
        allowPrivateIpAddress:
          type: boolean
          default: false
          description: Whether key material can be fetched from private IP addresses.
        allowUnsecuredHttpUri:
          type: boolean
          default: false
          description: Whether key material can be fetched over unsecured HTTP URIs.
        cacheMaxEntries:
          type: integer
          format: int32
          default: 50
          description: Maximum number of key material entries retained in the cache.
        cacheTtlSeconds:
          type: integer
          format: int32
          default: 300
          description: "Time-to-live, in seconds, for cached key material."
        fetchTimeoutMs:
          type: integer
          format: int32
          default: 5000
          description: "Timeout, in milliseconds, for fetching key material."
        maxResponseSizeKb:
          type: integer
          format: int32
          default: 32
          description: "Maximum key material response size, in kilobytes."
      title: Trusted domain key retrieval settings
    LoginSettings:
      type: object
      description: Configuration of the domain's login flow and the features offered
        on the sign-in page.
      properties:
        certificateBasedAuthEnabled:
          type: boolean
          default: false
          description: Whether certificate-based authentication is offered.
        certificateBasedAuthUrl:
          type: string
          description: URL used for certificate-based authentication.
        forgotPasswordEnabled:
          type: boolean
          default: false
          description: Whether users can initiate a forgot-password flow from the
            login page.
        hideForm:
          type: boolean
          default: false
          description: Whether the login form is hidden (for example when only social
            or identifier-first login is offered).
        identifierFirstEnabled:
          type: boolean
          default: false
          description: "Whether identifier-first login is enabled, prompting for the\
            \ username before the password."
        inherited:
          type: boolean
          default: true
          description: "Whether these login settings are inherited from a parent scope\
            \ rather than defined here. When true, the other fields are ignored."
        magicLinkAuthEnabled:
          type: boolean
          default: false
          description: Whether magic-link authentication is offered.
        passwordlessDeviceNamingEnabled:
          type: boolean
          default: false
          description: Whether users can name their passwordless devices.
        passwordlessEnabled:
          type: boolean
          default: false
          description: Whether passwordless (WebAuthn) authentication is offered.
        passwordlessEnforcePasswordEnabled:
          type: boolean
          default: false
          description: Whether a password is still required alongside passwordless
            authentication.
        passwordlessEnforcePasswordMaxAge:
          type: integer
          format: int32
          description: "Period, in seconds, after which the user's credentials must\
            \ be re-entered to keep using passwordless authentication."
        passwordlessRememberDeviceEnabled:
          type: boolean
          default: false
          description: Whether a passwordless device can be remembered to skip future
            challenges.
        registerEnabled:
          type: boolean
          default: false
          description: Whether users can self-register from the login page.
        rememberMeEnabled:
          type: boolean
          default: false
          description: Whether the login page offers a remember-me option.
        resetPasswordOnExpiration:
          type: boolean
          description: Whether the user is forced to reset their password once it
            expires.
      title: Login settings
    PasswordSettings:
      type: object
      description: "Password policy applied to users of the domain: complexity requirements,\
        \ expiry, and history."
      properties:
        excludePasswordsInDictionary:
          type: boolean
          description: Whether passwords found in a common-password dictionary are
            rejected.
        excludeUserProfileInfoInPassword:
          type: boolean
          description: Whether passwords containing the user's profile information
            are rejected.
        expiryDuration:
          type: integer
          format: int32
          description: Number of days after which a password expires and must be changed.
        includeNumbers:
          type: boolean
          description: Whether a password must contain at least one number.
        includeSpecialCharacters:
          type: boolean
          description: Whether a password must contain at least one special character.
        inherited:
          type: boolean
          default: true
          description: "Whether these password settings are inherited from a parent\
            \ scope rather than defined here. When true, the other fields are ignored."
        lettersInMixedCase:
          type: boolean
          description: Whether a password must contain both uppercase and lowercase
            letters.
        maxConsecutiveLetters:
          type: integer
          format: int32
          description: Maximum number of identical consecutive characters allowed
            in a password.
        maxLength:
          type: integer
          format: int32
          default: 128
          description: Maximum number of characters a password may contain.
        minLength:
          type: integer
          format: int32
          default: 8
          description: Minimum number of characters a password must contain.
        oldPasswords:
          type: integer
          format: int32
          description: Number of previous passwords retained in history and barred
            from reuse.
        passwordHistoryEnabled:
          type: boolean
          default: false
          description: Whether password history is enforced to prevent reuse of recent
            passwords.
      title: Password settings
    ReporterAttributeMapping:
      type: object
      description: "Exports one additional attribute, read from the audit context\
        \ by expression, under a chosen field name."
      properties:
        exportedName:
          type: string
          description: The name the evaluated value takes on the exported payload.
          example: user_sub
        expression:
          type: string
          description: Expression evaluated against the audit context.
          example: "{#context.attributes['user'].additionalInformation['sub']}"
      title: Reporter attribute mapping
    ResetPasswordSettings:
      type: object
      description: Rules applied to a self-service password reset.
      properties:
        oldPasswordRequired:
          type: boolean
          default: false
          description: Whether the user must supply their current password to set
            a new one.
        tokenAge:
          type: integer
          format: int32
          description: "Lifetime, in seconds, of the password-reset token."
      title: Reset-password settings
    SCIMSettings:
      type: object
      description: Configuration of the domain's SCIM 2.0 provisioning endpoints.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the SCIM provisioning API is enabled for the domain.
        idpSelectionEnabled:
          type: boolean
          default: false
          description: Whether an identity provider is selected for SCIM-provisioned
            users using a selection rule.
        idpSelectionRule:
          type: string
          description: Expression that selects the identity provider for a SCIM-provisioned
            user.
      title: SCIM settings
    SecretExpirationSettings:
      type: object
      description: Controls whether client secrets in the domain expire and after
        how long.
      properties:
        enabled:
          type: boolean
          description: Whether client-secret expiration is enabled.
        expiryTimeSeconds:
          type: integer
          format: int64
          description: "Lifetime, in seconds, of a client secret before it expires."
          example: 7776000
      title: Secret expiration settings
    SecurityProfileSettings:
      type: object
      description: Financial-grade API (FAPI) security profile configuration for the
        domain.
      properties:
        enableFapiBrazil:
          type: boolean
          default: false
          description: Whether the Open Banking Brasil Financial-grade API security
            profile (version 1.0) is applied.
        enablePlainFapi:
          type: boolean
          default: false
          description: Whether the standard Financial-grade API security profile (version
            1.0) is applied.
      title: Security profile settings
    SelfServiceAccountManagementSettings:
      type: object
      description: "Controls whether end users can manage their own account (for example,\
        \ reset their password) and the rules that apply."
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether self-service account management is enabled for end
            users.
        resetPassword:
          $ref: "#/components/schemas/ResetPasswordSettings"
      title: Self-service account management settings
    Severity:
      type: string
      enum:
      - error
      - warning
    SpiffeDomainSettings:
      type: object
      description: Workload identity (SPIFFE) settings for the domain.
      properties:
        allowPrivateIpAddress:
          type: boolean
          deprecated: true
          description: "Deprecated: moved to keyRetrievalSettings.allowPrivateIpAddress."
        allowUnsecuredHttpUri:
          type: boolean
          deprecated: true
          description: "Deprecated: moved to keyRetrievalSettings.allowUnsecuredHttpUri."
        cacheMaxEntries:
          type: integer
          format: int32
          deprecated: true
          description: "Deprecated: moved to keyRetrievalSettings.cacheMaxEntries."
        cacheTtlSeconds:
          type: integer
          format: int32
          deprecated: true
          description: "Deprecated: moved to keyRetrievalSettings.cacheTtlSeconds."
        clockSkewSeconds:
          type: integer
          format: int32
          default: 30
          description: "Allowed clock skew, in seconds, when validating JWT temporal\
            \ claims."
        defaultAllowedAlgorithms:
          type: array
          default:
          - RS256
          - RS384
          - RS512
          - ES256
          - ES384
          - ES512
          - EdDSA
          description: Default allowlist of signature algorithms accepted for SPIFFE
            JWT validation.
          items:
            type: string
        enabled:
          type: boolean
          default: false
          description: Whether SPIFFE workload identity support is enabled for the
            domain.
        fetchTimeoutMs:
          type: integer
          format: int32
          deprecated: true
          description: "Deprecated: moved to keyRetrievalSettings.fetchTimeoutMs."
        maxJwtLifetimeSeconds:
          type: integer
          format: int32
          default: 300
          description: "Maximum accepted JWT lifetime, in seconds, computed as exp\
            \ minus iat."
        maxResponseSizeKb:
          type: integer
          format: int32
          deprecated: true
          description: "Deprecated: moved to keyRetrievalSettings.maxResponseSizeKb."
    TokenExchangeOAuthSettings:
      type: object
      description: "OAuth-specific token-exchange behavior, such as how scopes are\
        \ handled, with optional inheritance from domain defaults."
      properties:
        inherited:
          type: boolean
          default: true
          description: Whether these settings are inherited from the domain defaults
            rather than defined here.
        scopeHandling:
          type: string
          default: downscoping
          description: How scopes are handled when issuing the exchanged token. DOWNSCOPING
            restricts the issued token to a subset of the original scopes.
          enum:
          - downscoping
          - permissive
      title: Token exchange OAuth settings
    TokenExchangeSettings:
      type: object
      description: "OAuth 2.0 Token Exchange (RFC 8693) configuration for the domain,\
        \ covering impersonation and delegation."
      properties:
        allowDelegation:
          type: boolean
          default: false
          description: "Whether delegation is allowed, where an actor acts on behalf\
            \ of the subject and an \"act\" claim is added to the issued token. At\
            \ least one of allowImpersonation or allowDelegation must be enabled."
        allowImpersonation:
          type: boolean
          default: true
          description: "Whether impersonation is allowed, where the issued token represents\
            \ the subject directly. At least one of allowImpersonation or allowDelegation\
            \ must be enabled."
        allowedActorTokenTypes:
          type: array
          description: Token types accepted as the actor token when delegating.
          example:
          - urn:ietf:params:oauth:token-type:access_token
          - urn:ietf:params:oauth:token-type:id_token
          items:
            type: string
            description: Token types accepted as the actor token when delegating.
            example: "[\"urn:ietf:params:oauth:token-type:access_token\",\"urn:ietf:params:oauth:token-type:id_token\"\
              ]"
        allowedRequestedTokenTypes:
          type: array
          description: Token types that may be requested as the result of an exchange.
          example:
          - urn:ietf:params:oauth:token-type:access_token
          - urn:ietf:params:oauth:token-type:id_token
          items:
            type: string
            description: Token types that may be requested as the result of an exchange.
            example: "[\"urn:ietf:params:oauth:token-type:access_token\",\"urn:ietf:params:oauth:token-type:id_token\"\
              ]"
        allowedSubjectTokenTypes:
          type: array
          description: Token types accepted as the subject token in an exchange.
          example:
          - urn:ietf:params:oauth:token-type:access_token
          - urn:ietf:params:oauth:token-type:id_token
          items:
            type: string
            description: Token types accepted as the subject token in an exchange.
            example: "[\"urn:ietf:params:oauth:token-type:access_token\",\"urn:ietf:params:oauth:token-type:id_token\"\
              ]"
        enabled:
          type: boolean
          default: false
          description: Whether token exchange is enabled for the domain.
        idJagSettings:
          $ref: "#/components/schemas/IdJagSettings"
        maxDelegationDepth:
          type: integer
          format: int32
          default: 25
          description: Maximum depth of the delegation chain (nested "act" claims).
            Range 1–100.
          maximum: 100
          minimum: 1
        tokenExchangeOAuthSettings:
          $ref: "#/components/schemas/TokenExchangeOAuthSettings"
        trustedIssuers:
          type: array
          deprecated: true
          description: "Deprecated: use the trusted-domains API instead. External\
            \ issuers whose JWTs may be accepted as subject or actor tokens. A projection\
            \ over the security domain's token-exchange trusted domains; a write replaces\
            \ the list, so an omitted issuer is no longer trusted."
          items:
            $ref: "#/components/schemas/TrustedIssuer"
      title: Token exchange settings
    TrustedIssuer:
      type: object
      deprecated: true
      description: "An external token issuer whose JWTs are accepted as subject or\
        \ actor tokens during token exchange, validated with the configured key material."
      properties:
        certificate:
          type: string
          description: PEM-encoded X.509 certificate. Required when keyResolutionMethod
            is PEM.
        issuer:
          type: string
          description: Expected value of the "iss" claim in the external JWT.
          example: https://issuer.example.com
        jwksUri:
          type: string
          description: JWKS endpoint URL. Required when keyResolutionMethod is JWKS_URL.
          example: https://issuer.example.com/.well-known/jwks.json
        keyResolutionMethod:
          type: string
          description: How the issuer's signing key is resolved. JWKS_URL fetches
            keys from a JWKS endpoint; PEM uses an inline X.509 certificate.
          enum:
          - jwks_url
          - pem
        scopeMappings:
          type: object
          additionalProperties:
            type: string
            description: One-to-one mapping from external scope to domain scope. Unmapped
              issuer scopes are dropped (fail-closed).
          description: One-to-one mapping from external scope to domain scope. Unmapped
            issuer scopes are dropped (fail-closed).
        userBindingCriteria:
          type: array
          description: Criteria used to locate a domain user when user binding is
            enabled. All criteria are combined with AND.
          items:
            $ref: "#/components/schemas/UserBindingCriterion"
        userBindingEnabled:
          type: boolean
          default: false
          description: "Whether the external JWT subject is resolved to a single domain\
            \ user using the user binding criteria. When false, a virtual user is\
            \ built from the token claims only."
      title: Trusted issuer
    UMASettings:
      type: object
      description: Configuration of the domain's User-Managed Access (UMA 2.0) authorization
        features.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether User-Managed Access is enabled for the domain.
      title: UMA settings
    UserBindingCriterion:
      type: object
      description: A single rule that matches a domain user attribute against a value
        derived from the external token claims.
      properties:
        attribute:
          type: string
          description: Domain user attribute used for the lookup. Must match a field
            supported by the user repository search.
          example: emails.value
        expression:
          type: string
          description: Expression evaluated against the validated token claims (variable
            "token") to produce the value to match.
          example: "{#token['email']}"
      title: User binding criterion
    VirtualHost:
      type: object
      description: A host and path the domain is exposed on. The host and path combination
        must be unique across all domains.
      properties:
        host:
          type: string
          description: Hostname the domain is served on.
          example: auth.example.com
        overrideEntrypoint:
          type: boolean
          default: false
          description: Whether this virtual host overrides the organization entry
            point.
        path:
          type: string
          description: Context path the domain is served under on this host.
          example: /customers
      title: Virtual host
    WebAuthnSettings:
      type: object
      description: WebAuthn (FIDO2) relying-party configuration governing passwordless
        and multi-factor authentication for the domain.
      properties:
        attestationConveyancePreference:
          type: string
          default: none
          description: "Relying-party preference for attestation conveyance during\
            \ credential creation. NONE requests no attestation, INDIRECT allows anonymized\
            \ attestation, and DIRECT requests the authenticator's attestation statement."
          enum:
          - none
          - indirect
          - direct
        authenticatorAttachment:
          type: string
          description: Preferred authenticator attachment. PLATFORM selects authenticators
            bound to the device (such as a fingerprint reader); CROSS_PLATFORM selects
            roaming authenticators (such as a security key).
          enum:
          - cross_platform
          - platform
        certificates:
          type: object
          additionalProperties:
            type: string
            description: "Trusted device-attestation X.509 certificates, keyed by\
              \ name."
          description: "Trusted device-attestation X.509 certificates, keyed by name."
        enforceAuthenticatorIntegrity:
          type: boolean
          default: false
          description: Whether to periodically re-verify that registered authenticators
            remain valid against the FIDO2 Metadata Service.
        enforceAuthenticatorIntegrityMaxAge:
          type: integer
          format: int32
          description: "Maximum elapsed time, in seconds, since an authenticator was\
            \ last verified before it is re-checked on the next passwordless login."
        forceRegistration:
          type: boolean
          default: false
          description: Whether to reject registration of a credential already registered
            to a different user.
        origin:
          type: string
          description: Relying-party origin; must match the browser's window.location.origin
            during registration and authentication ceremonies.
          example: https://auth.example.com
        relyingPartyId:
          type: string
          description: "Relying-party identifier: a domain string that scopes credentials\
            \ to this entity. A credential can only be used with the relying party\
            \ it was registered against."
          example: auth.example.com
        relyingPartyName:
          type: string
          description: Human-readable relying-party name shown to users during ceremonies.
          example: Example Inc.
        requireResidentKey:
          type: boolean
          default: false
          description: Whether the authenticator must create a client-side resident
            (discoverable) credential.
        userVerification:
          type: string
          default: preferred
          description: "Relying-party requirement regarding user verification during\
            \ a ceremony. REQUIRED enforces verification, PREFERRED requests it when\
            \ available, and DISCOURAGED avoids it."
          enum:
          - required
          - preferred
          - discouraged
      title: WebAuthn settings
    WebProtectionSettings:
      type: object
      description: HTTP security headers applied to the domain's login and consent
        pages.
      properties:
        csp:
          $ref: "#/components/schemas/CspSettings"
        xframe:
          $ref: "#/components/schemas/XFrameSettings"
        xss:
          $ref: "#/components/schemas/XssProtectionSettings"
      title: Web protection settings
    XFrameSettings:
      type: object
      description: Controls whether the domain's pages may be embedded in frames on
        other origins.
      properties:
        action:
          type: string
          description: X-Frame-Options action. Omit to leave the header out.
          enum:
          - DENY
          - SAMEORIGIN
          example: DENY
        enabled:
          type: boolean
          default: false
          description: Whether X-Frame-Options is enabled for the domain when not
            inherited.
        inherited:
          type: boolean
          default: true
          description: "Whether X-Frame-Options settings are inherited from the gateway\
            \ defaults (gravitee.yml). When null, legacy behaviour applies: enabled=true\
            \ overrides and enabled=false inherits."
      title: X-Frame-Options settings
    XssProtectionSettings:
      type: object
      description: Controls the legacy X-XSS-Protection response header.
      properties:
        action:
          type: string
          description: Value of the X-XSS-Protection header.
          example: 1; mode=block
        enabled:
          type: boolean
          default: false
          description: Whether X-XSS-Protection is enabled for the domain when not
            inherited.
        inherited:
          type: boolean
          default: true
          description: "Whether X-XSS-Protection settings are inherited from the gateway\
            \ defaults (gravitee.yml). When null, legacy behaviour applies: enabled=true\
            \ overrides and enabled=false inherits."
      title: XSS protection settings
  securitySchemes:
    BearerAuth:
      description: "Authentication uses a bearer token: a JWT, or an opaque user service-account\
        \ access token. Every operation is additionally permission-gated against the\
        \ target organization, environment, and resource; a caller lacking the required\
        \ permission receives a 403 response."
      scheme: bearer
      type: http
