# MAPI override (MongoDB). Use with: helm -f am-mongodb-common.yaml -f am-mongodb-mapi.yaml
api:
  # One replica per component: the chart's default autoscaler scales on memory, which an AM JVM
  # always exceeds, and 3 replicas of each component exhaust the database connections.
  autoscaling:
    enabled: false
  enabled: true
  replicaCount: 1
  image:
    repository: graviteeio/am-management-api
    tag: 4.10.0
    pullPolicy: IfNotPresent
  ingress:
    enabled: false

gateway:
  enabled: false

ui:
  autoscaling:
    enabled: false
  replicaCount: 1
  image:
    repository: graviteeio/am-management-ui
    tag: 4.10.0
    pullPolicy: IfNotPresent
  ingress:
    enabled: false
  baseURL: "http://localhost:8093/management"
