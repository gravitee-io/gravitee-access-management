# Gateway dp1 (PostgreSQL). Release: am-gateway-dp1. Port-forward: 8091.
labels:
  environment: migration-test
  part-of: am-migration-tool

management:
  type: jdbc

jdbc:
  drivers:
    - https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar
    - https://repo1.maven.org/maven2/org/postgresql/r2dbc-postgresql/1.0.7.RELEASE/r2dbc-postgresql-1.0.7.RELEASE.jar

repositories:
  system-cluster: gateway
  management:
    type: jdbc
    jdbc:
      driver: postgresql
      host: postgres-postgresql
      port: 5432
      database: gravitee-am
      username: gravitee
      password: gravitee-password
  # Tokens live in the data plane database, with their own connection (independent of the management scope).
  oauth2:
    type: jdbc
    use-management-settings: false
    jdbc:
      driver: postgresql
      host: postgres-postgresql
      port: 5432
      database: gravitee-am-dp1
      username: gravitee
      password: gravitee-password
  gateway:
    type: jdbc
    use-management-settings: false
    dataPlane:
      id: dp1
      url: "http://localhost:8091"
    jdbc:
      driver: postgresql
      host: postgres-postgresql
      port: 5432
      database: gravitee-am-dp1
      username: gravitee
      password: gravitee-password

api:
  enabled: false

gateway:
  enabled: true
  replicaCount: 1
  services:
    sync:
      permissions: true
  image:
    repository: graviteeio/am-gateway
    tag: 4.10.0
    pullPolicy: IfNotPresent
  ingress:
    enabled: false
  env:
    - name: LIQUIBASE_ANALYTICS_ENABLED
      value: "false"
  liquibase:
    enabled: true

ui:
  enabled: false

license:
  accept: true
