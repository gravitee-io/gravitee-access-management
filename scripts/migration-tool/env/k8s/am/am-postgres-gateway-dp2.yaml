# Gateway dp2 (PostgreSQL). Release: am-gateway-dp2. Port-forward: 8092.
labels:
  environment: migration-test
  part-of: am-migration-tool

management:
  type: jdbc

jdbc:
  drivers:
    - https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar
    - https://repo1.maven.org/maven2/org/postgresql/r2dbc-postgresql/1.0.7.RELEASE/r2dbc-postgresql-1.0.7.RELEASE.jar

repositories:
  # Default identity providers store their users in the management database, which every node of every
  # version reads the same way. With `gateway`, a 4.13 Management API puts them in the data plane database,
  # which a 4.12 gateway does not read (AM-7788).
  system-cluster: management
  management:
    type: jdbc
    jdbc:
      driver: postgresql
      host: postgres-postgresql
      port: 5432
      database: gravitee-am
      username: gravitee
      password: gravitee-password
  # Tokens live in the data plane database, with their own connection (independent of the management scope).
  oauth2:
    type: jdbc
    use-management-settings: false
    jdbc:
      driver: postgresql
      host: postgres-postgresql
      port: 5432
      database: gravitee-am-dp2
      username: gravitee
      password: gravitee-password
  gateway:
    type: jdbc
    use-management-settings: false
    dataPlane:
      id: dp2
      url: "http://localhost:8092"
    jdbc:
      driver: postgresql
      host: postgres-postgresql
      port: 5432
      database: gravitee-am-dp2
      username: gravitee
      password: gravitee-password

api:
  enabled: false

gateway:
  # One replica per component: the chart's default autoscaler scales on memory, which an AM JVM
  # always exceeds, and 3 replicas of each component exhaust the database connections.
  autoscaling:
    enabled: false
  enabled: true
  replicaCount: 1
  services:
    sync:
      permissions: true
  image:
    repository: graviteeio/am-gateway
    tag: 4.10.0
    pullPolicy: IfNotPresent
  ingress:
    enabled: false
  env:
    - name: LIQUIBASE_ANALYTICS_ENABLED
      value: "false"
  liquibase:
    enabled: true

ui:
  autoscaling:
    enabled: false
  enabled: false

license:
  accept: true
