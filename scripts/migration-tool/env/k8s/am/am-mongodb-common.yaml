# MAPI base only (MongoDB). Use with: helm -f am-mongodb-common.yaml -f am-mongodb-mapi.yaml
labels:
  environment: migration-test
  part-of: am-migration-tool

mongodb-replicaset:
  enabled: false

repositories:
  # Default identity providers store their users in the management database, which every node of every
  # version reads the same way. With `gateway`, a 4.13 Management API puts them in the data plane database,
  # which a 4.12 gateway does not read (AM-7788).
  system-cluster: management
  management:
    type: mongodb
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee?serverSelectionTimeoutMS=30000"
      dbname: gravitee
  oauth2:
    type: mongodb
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee?serverSelectionTimeoutMS=30000"
      dbname: gravitee
  gateway:
    type: mongodb
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee?serverSelectionTimeoutMS=30000"
      dbname: gravitee

dataPlanes:
  - id: default
    type: mongodb
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee?serverSelectionTimeoutMS=30000"
      dbname: gravitee
  - id: dp1
    type: mongodb
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee-dp1?serverSelectionTimeoutMS=30000&authSource=gravitee"
      dbname: gravitee-dp1
  - id: dp2
    type: mongodb
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee-dp2?serverSelectionTimeoutMS=30000&authSource=gravitee"
      dbname: gravitee-dp2

api:
  enabled: false

gateway:
  enabled: false

license:
  accept: true
