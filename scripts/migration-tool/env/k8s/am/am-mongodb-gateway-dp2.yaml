# Gateway dp2 (MongoDB). Release: am-gateway-dp2. Port-forward: 8092.
labels:
  environment: migration-test
  part-of: am-migration-tool

mongodb-replicaset:
  enabled: false

repositories:
  # Default identity providers store their users in the management database, which every node of every
  # version reads the same way. With `gateway`, a 4.13 Management API puts them in the data plane database,
  # which a 4.12 gateway does not read (AM-7788).
  system-cluster: management
  management:
    type: mongodb
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee?serverSelectionTimeoutMS=30000"
      dbname: gravitee
  oauth2:
    type: mongodb
    use-management-settings: false
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee?serverSelectionTimeoutMS=30000"
      dbname: gravitee
  gateway:
    type: mongodb
    use-management-settings: false
    dataPlane:
      id: dp2
      url: "http://localhost:8092"
    mongodb:
      uri: "mongodb://gravitee:gravitee-password@mongo-mongodb:27017/gravitee-dp2?serverSelectionTimeoutMS=30000&authSource=gravitee"
      dbname: gravitee-dp2

api:
  enabled: false

gateway:
  # One replica per component: the chart's default autoscaler scales on memory, which an AM JVM
  # always exceeds, and 3 replicas of each component exhaust the database connections.
  autoscaling:
    enabled: false
  enabled: true
  replicaCount: 1
  services:
    sync:
      permissions: true
  image:
    repository: graviteeio/am-gateway
    tag: 4.10.0
    pullPolicy: IfNotPresent
  ingress:
    enabled: false

ui:
  autoscaling:
    enabled: false
  enabled: false

license:
  accept: true
