# Migration Tool - DB values for the internal MongoDB chart (env/k8s/db/mongodb).
fullnameOverride: mongo-mongodb

image:
  repository: mongo
  tag: "8.2"
  pullPolicy: IfNotPresent

auth:
  existingSecret: mongo-mongodb-auth
  username: gravitee
  database: gravitee
  extraDatabases:
    - gravitee-dp1
    - gravitee-dp2

persistence:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi
