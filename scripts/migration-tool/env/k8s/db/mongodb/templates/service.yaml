apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongo.name" . }}
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: 27017
      protocol: TCP
