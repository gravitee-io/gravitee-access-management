apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongo.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mongo.name" . }}-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/init: {{ include (print $.Template.BasePath "/init-user.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ .Values.securityContext.runAsGroup | default 999 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser | default 999 }}
            runAsGroup: {{ .Values.securityContext.runAsGroup | default 999 }}
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.auth.rootUsername | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: mongodb-root-password
            - name: MONGODB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: mongodb-passwords
          ports:
            - containerPort: 27017
              name: mongodb
          # The image entrypoint runs the init scripts against a temporary mongod, then
          # restarts it with authorization enabled. Only that final mongod counts as ready.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "db.adminCommand({ getCmdLineOpts: 1 }).parsed.security?.authorization === 'enabled' || quit(1)"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdb
              mountPath: /data/configdb
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
{{ .Values.resources | toYaml | nindent 12 }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: {{ include "mongo.name" . }}-init
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
