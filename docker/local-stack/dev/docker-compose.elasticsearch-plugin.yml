#
# Mounts the locally built Elasticsearch reporter plugin over the one baked into the images, so a
# source build picks up plugin changes without rebuilding the distribution.
#
# Dev only, and separate from docker-compose.elasticsearch.yml on purpose: it needs the zip staged at
# ./plugins/reporter-elasticsearch/ (local-stack.sh does that before `up`), which does not exist in
# CI. CI runs the distribution images, which already ship the reporter.
#

services:
  gateway:
    volumes:
      - ./plugins/reporter-elasticsearch/reporter-am-elasticsearch.zip:/opt/graviteeio-am-gateway/plugins/reporter-am-elasticsearch.zip:ro

  management:
    volumes:
      - ./plugins/reporter-elasticsearch/reporter-am-elasticsearch.zip:/opt/graviteeio-am-management-api/plugins/reporter-am-elasticsearch.zip:ro
