#
# Elasticsearch overlay: a single-node ES cluster plus the gravitee-am-reporter-elasticsearch
# plugin mounted into the gateway and management-api plugin directories.
#
# The reporter itself is configured per-domain from the Console (Settings -> Reporters):
#   endpoint  http://elasticsearch:9200   (docker network hostname; use localhost:9200 from the host)
#
# local-stack.sh stages the built plugin zip to ./plugins/reporter-elasticsearch/ before `up`.
#

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.19.19}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - ${AM_ES_HOST_PORT:-9200}:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    volumes:
      - ./plugins/reporter-elasticsearch/reporter-am-elasticsearch.zip:/opt/graviteeio-am-gateway/plugins/reporter-am-elasticsearch.zip:ro

  management:
    volumes:
      - ./plugins/reporter-elasticsearch/reporter-am-elasticsearch.zip:/opt/graviteeio-am-management-api/plugins/reporter-am-elasticsearch.zip:ro
