# Elasticsearch overlay: a single-node ES cluster, and nothing else.
#
# Deliberately holds no gateway or management-api service overrides, so CI can bring it up against
# images that already carry the reporter without needing a locally built plugin zip on disk. The dev
# plugin mounts live in docker-compose.elasticsearch-plugin.yml.
#
# The reporter itself is configured per-domain from the Console (Settings -> Reporters):
#   endpoint  http://elasticsearch:9200   (docker network hostname; use localhost:9200 from the host)
#

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.19.19}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=false
      # 512m suits a handful of demo audits. Raise it for volume testing: shard overhead is charged to
      # heap, and daily indices mean shard count grows with retention, not with the number of audits.
      - ES_JAVA_OPTS=-Xms${AM_ES_HEAP:-512m} -Xmx${AM_ES_HEAP:-512m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - ${AM_ES_HOST_PORT:-9200}:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

# Without this the indices live in the container's writable layer, so anything that recreates the
# container — a heap change, an image bump — silently discards every audit written so far.
volumes:
  elasticsearch-data:
