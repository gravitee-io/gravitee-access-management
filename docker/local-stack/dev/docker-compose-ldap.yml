# OpenLDAP directory backing the LDAP identity-provider tests (AM-7447).
#
# Start with:  ./local-stack.sh up --with ldap
#
# The LDAP IdP plugin already ships inside the AM distribution zips
# (gravitee-am-identityprovider-ldap), so — unlike the Kerberos overlay — no
# extra plugin zip needs mounting into the gateway or management containers.
#
# IdP configuration that matches this service:
#   URL                    ldap://openldap:389
#   Base DN                dc=gravitee,dc=io
#   Bind DN                cn=admin,dc=gravitee,dc=io
#   Bind password          admin
#   User search base       ou=people
#   User search filter     (uid={0})
#   User return attribute  +      (all operational attributes)

services:
  openldap:
    # Bitnami moved its public catalog to subscription-only "Secure Images" in 2025;
    # the OSS tags remain published under bitnamilegacy. Pinned to a digest-stable
    # tag because that repository is archived and receives no updates.
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    hostname: openldap
    ports:
      # The image runs slapd as a non-root user, so it cannot bind the privileged
      # port 389 — it listens on 1389 both inside the container and on the host.
      - "1389:1389"
    environment:
      - LDAP_ROOT=dc=gravitee,dc=io
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_CUSTOM_LDIF_DIR=/ldifs
      - LDAP_SKIP_DEFAULT_TREE=yes
      # Needed so openldap-init can write to cn=config to install the memberof
      # overlay. The image supports no memberof env var of its own — it only
      # ships accesslog, syncprov and ppolicy.
      - LDAP_CONFIG_ADMIN_ENABLED=yes
      - LDAP_CONFIG_ADMIN_USERNAME=admin
      - LDAP_CONFIG_ADMIN_PASSWORD=configadmin
    volumes:
      - ./ldap/gravitee-io.ldif:/ldifs/gravitee-io.ldif:ro
    healthcheck:
      # Bind as the admin DN and read the base entry: proves slapd is up AND the
      # seed ldif has been applied, so tests can never race the import.
      test:
        - CMD
        - ldapsearch
        - -x
        - -H
        - ldap://localhost:1389
        - -D
        - cn=admin,dc=gravitee,dc=io
        - -w
        - admin
        - -b
        - uid=ldap-admin,ou=people,dc=gravitee,dc=io
        - -s
        - base
        - "(objectClass=*)"
      interval: 5s
      timeout: 3s
      retries: 20

  # Installs the memberof overlay and then adds the groups, in that order.
  # Reuses the openldap image purely for its ldapmodify/ldapadd binaries, so no
  # extra image has to be pulled.
  openldap-init:
    image: bitnamilegacy/openldap:2.6.10-debian-12-r4
    depends_on:
      openldap:
        condition: service_healthy
    volumes:
      - ./ldap/memberof-overlay.ldif:/ldifs/memberof-overlay.ldif:ro
      - ./ldap/groups.ldif:/ldifs/groups.ldif:ro
    entrypoint:
      - bash
      - -ec
      - |
        # Tolerate only "already exists" style failures, so a restart against an
        # already-configured directory is a no-op while a REAL error still stops
        # the stack. Blanket "|| true" here hides genuine breakage — e.g. a wrong
        # olcModuleLoad path fails with rc=80 and would otherwise pass silently.
        #   20 = LDAP_TYPE_OR_VALUE_EXISTS   68 = LDAP_ALREADY_EXISTS
        #
        # NOTE: every shell variable below is written $$VAR, not $VAR. Compose
        # performs its own interpolation on this file first, and a single $ would
        # be substituted to an empty string before bash ever runs.
        apply() { # apply <description> <ldapcmd...>
          local desc="$$1"; shift
          local rc=0
          "$$@" || rc=$$?
          case "$$rc" in
            0)      echo "ok: $$desc" ;;
            20|68)  echo "ok: $$desc (already applied)" ;;
            *)      echo "FATAL: $$desc failed with rc=$$rc"; exit 1 ;;
          esac
        }

        apply "memberof overlay" \
          ldapmodify -H ldap://openldap:1389 -D "cn=admin,cn=config" -w configadmin \
            -f /ldifs/memberof-overlay.ldif

        # Groups must be written AFTER the overlay so memberOf is stamped onto users.
        apply "groups" \
          ldapadd -H ldap://openldap:1389 -D "cn=admin,dc=gravitee,dc=io" -w admin \
            -f /ldifs/groups.ldif

        # The overlay only stamps memberOf on writes that happen while it is
        # installed. If the groups already existed from a previous run that had no
        # overlay, they carry no memberOf — rewrite them so they do.
        if ! ldapsearch -x -LLL -H ldap://openldap:1389 -D "cn=admin,dc=gravitee,dc=io" -w admin \
               -b "uid=ldap-admin,ou=people,dc=gravitee,dc=io" -s base memberOf \
             | grep -q "memberOf:"; then
          echo "groups predate the overlay — rewriting them"
          ldapdelete -H ldap://openldap:1389 -D "cn=admin,dc=gravitee,dc=io" -w admin \
            "cn=GRAVITEE_ADMINS,ou=groups,dc=gravitee,dc=io" \
            "cn=GRAVITEE_USERS,ou=groups,dc=gravitee,dc=io"
          apply "groups (rewrite)" \
            ldapadd -H ldap://openldap:1389 -D "cn=admin,dc=gravitee,dc=io" -w admin \
              -f /ldifs/groups.ldif
        fi

        # Hard gate. A silent miss here surfaces much later as an inexplicable
        # role-mapper failure, so assert the exact value the mappers depend on.
        ldapsearch -x -LLL -H ldap://openldap:1389 -D "cn=admin,dc=gravitee,dc=io" -w admin \
          -b "uid=ldap-admin,ou=people,dc=gravitee,dc=io" -s base memberOf \
          | grep -q "^memberOf: cn=GRAVITEE_ADMINS,ou=groups,dc=gravitee,dc=io$" \
          || { echo "FATAL: memberof overlay did not populate memberOf"; exit 1; }
        echo "LDAP ready: memberof overlay active, groups loaded, memberOf verified"

  # Gate stack readiness on the directory being seeded AND the overlay applied, so
  # a test can never race the import. Deliberately hung off am-wait rather than
  # gateway/management: AM does not need LDAP to boot, and coupling them would let
  # a directory failure block the entire stack.
  am-wait:
    depends_on:
      openldap-init:
        condition: service_completed_successfully
