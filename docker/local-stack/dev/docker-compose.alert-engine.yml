#
# Alert Engine overlay: starts Gravitee Alert Engine and connects both planes to it. The
# management API pushes the alert triggers (and their notifiers) of each domain, the gateway
# pushes the authentication events they are evaluated against, and Alert Engine itself sends
# the notifications (e.g. the webhook notifier calling wiremock).
# It is absent by default, so the standalone suites are unaffected.
#
services:
  alert-engine:
    image: graviteeio/ae-engine:${AE_VERSION:-3.0.2}
    environment:
      # Same license as AM, base64-encoded. The CI jobs export it; local-stack.sh derives it from
      # license/gravitee-universe-v4.key.
      - GRAVITEE_LICENSE_KEY=${GRAVITEE_LICENSE_KEY}
      # The technical API listens on localhost by default; open it so it can be published.
      - gravitee_services_core_http_host=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18072/_node/health", "-u", "admin:adminadmin"]
      interval: 5s
      timeout: 2s
      retries: 20
    ports:
      - 8072:8072
      - 18072:18072

  management:
    environment:
      - gravitee_alerts_alert-engine_enabled=true
      # A single node: stick to the compose alias rather than the addresses it advertises.
      - gravitee_alerts_alert-engine_ws_discovery=false
      - gravitee_alerts_alert-engine_ws_endpoints_0=http://alert-engine:8072
      - gravitee_alerts_alert-engine_ws_security_username=admin
      - gravitee_alerts_alert-engine_ws_security_password=adminadmin
      # The "too many login failures" alert is a failure rate over a time window, evaluated once
      # a minimum number of logins has been seen. The defaults (1000 logins over 10 minutes) are
      # sized for production traffic; shrink them so a handful of failed logins fires the alert
      # within seconds.
      - GRAVITEE_ALERTS_TOO_MANY_LOGIN_FAILURES_SAMPLESIZE=5
      - GRAVITEE_ALERTS_TOO_MANY_LOGIN_FAILURES_WINDOW=10
    depends_on:
      alert-engine:
        condition: service_healthy

  gateway:
    environment:
      - gravitee_alerts_alert-engine_enabled=true
      - gravitee_alerts_alert-engine_ws_discovery=false
      - gravitee_alerts_alert-engine_ws_endpoints_0=http://alert-engine:8072
      - gravitee_alerts_alert-engine_ws_security_username=admin
      - gravitee_alerts_alert-engine_ws_security_password=adminadmin
    depends_on:
      alert-engine:
        condition: service_healthy
