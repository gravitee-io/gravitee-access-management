#
# Cloud/console overlay: puts both planes into managed-cloud mode and starts the
# cockpit mock the management API dials out to. Layer this on top of the base +
# dev/ci overlays to exercise the console/cloud command path (e.g. Cockpit
# ENVIRONMENT commands whose gateway access points become entrypoints).
# It is absent by default, so the standalone suites are unaffected.
#
services:
  cockpit-mock:
    build:
      context: ../../../gravitee-am-cockpit-mock
    # The private key matching the certificate the management API holds under alias 'cockpit-client'.
    # It lets the mock mint the SSO token AM's /auth/cockpit endpoint accepts, the way real Cockpit does.
    command: ["--sso-private-key", "/cockpit/cockpit-key.pem"]
    volumes:
      - ./cockpit/cockpit-key.pem:/cockpit/cockpit-key.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/_control/status"]
      interval: 5s
      timeout: 2s
      retries: 10
    ports:
      - 8085:8085

  management:
    environment:
      - GRAVITEE_CLOUD_ENABLED=true
      - GRAVITEE_INSTALLATION_TYPE=managed
      - GRAVITEE_CLOUD_CONNECTOR_WS_ENDPOINTS_0=http://cockpit-mock:8085
      - gravitee_installation_managed_accessPoints_environment_gateway_host={environment}.{organization}.{account}.example.com
      # A managed cloud node has no platform license
      - GRAVITEE_LICENSE_KEY=
      # Cockpit signs the SSO token it redirects users into AM with; CockpitAuthenticationFilter verifies
      # it against the certificate held under alias 'cockpit-client' (its default) in this keystore. The
      # matching private key is mounted on the cockpit-mock service above.
      - GRAVITEE_CLOUD_CONNECTOR_WS_SSL_KEYSTORE_TYPE=PKCS12
      - GRAVITEE_CLOUD_CONNECTOR_WS_SSL_KEYSTORE_PATH=/opt/graviteeio-am-management-api/cockpit/cockpit-truststore.p12
      - GRAVITEE_CLOUD_CONNECTOR_WS_SSL_KEYSTORE_PASSWORD=cockpit
      - >-
        JAVA_OPTS=-Dgravitee.license=/opt/graviteeio-am-management-api/license/no-platform-license.key
    volumes:
      - ./cockpit/cockpit-truststore.p12:/opt/graviteeio-am-management-api/cockpit/cockpit-truststore.p12:ro
    depends_on:
      cockpit-mock:
        condition: service_healthy

  # The gateway never talks to Cockpit, so it needs no connector endpoint, but it does resolve the
  # environment's entrypoint when building links in the emails it sends, and that is gated on managed
  # cloud. Without these it silently falls back to the data plane gateway url.
  gateway:
    environment:
      - GRAVITEE_CLOUD_ENABLED=true
      - GRAVITEE_INSTALLATION_TYPE=managed
      # A managed cloud node has no platform license
      - GRAVITEE_LICENSE_KEY=
      - JAVA_OPTS=-Dgravitee.license=/opt/graviteeio-am-gateway/license/no-platform-license.key
