<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access confirmation</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{assets/css/main.css}">

    <!-- Favicon and touch icons -->
    <link rel="shortcut icon" th:href="${theme.faviconUrl} ?: @{assets/ico/favicon.ico}">

    <!-- Custom CSS -->
    <style th:if="${theme.css}" th:text="${theme.css}"></style>
    <style th:if="${theme.customCss}" th:text="${theme.customCss}"></style>
</head>

<body>

<div class="container">
    <div class="header">
        <img class="logo" th:src="${theme.logoUrl} ?: @{assets/images/gravitee-logo.svg}">
        <div class="title">
            <span th:text="#{oauth.authorization_details_consent.title}"/>
        </div>
        <div class="header-description">
            <img class="cimd-consent-client-logo" th:if="${cimdLogoUrl}" th:src="${cimdLogoUrl}" th:attr="alt=${client.clientName}">
            <span th:text="#{oauth.consent.description.before}"/><span class="deep-blue" th:text="${client.clientName}"/><span th:text="#{oauth.consent.description.after}"/>
        </div>
    </div>
    <div class="section">
        <form class="form" role="form" th:id="confirmationForm" th:action="${action}" method="post">
            <span class="header-description start" th:text="#{oauth.authorization_details_consent.instructions}"></span>

            <div class="authorization-detail-consent-section">
                <table class="scope-consent-table authorization-detail-consent-table" th:each="detail : ${authorizationDetails.all}"
                       th:with="detailType=${authorizationDetailTypes.get(detail.type)}">
                    <thead>
                        <tr>
                            <th colspan="2" class="authorization-detail-consent-type">
                                <span th:text="${detailType != null and detailType.name != null ? detailType.name : detail.type}"></span>
                                <span class="authorization-detail-consent-type-description grey"
                                      th:if="${detailType != null and detailType.description != null}" th:text="${detailType.description}"></span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="scope-consent-row" th:each="field : ${detail}" th:unless="${field.key == 'type'}">
                            <td class="scope-consent-cell-name"><span th:text="${field.key}"></span></td>
                            <td class="scope-consent-cell-description"><span class="grey" th:text="${#strings.replace(#strings.replace(#strings.replace(#strings.replace(field.value, '[', '[ '), ']', ' ]'), '{', '{ '), '}', ' }')}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <span class="header-description start" th:text="${client.clientName} + ' ' + #{oauth.disclaimer}"></span>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="cimd-consent-host-verified" th:if="${cimdClientIdHostname}">
                <span class="icons">check_circle</span>
                <strong class="cimd-consent-hostname" th:text="${cimdClientIdHostname}"></strong>
                <span th:text="#{oauth.consent.cimd.verified}"></span>
            </div>

            <div class="scope-consent-buttons">
                <button type="submit" id="denyButton" name="user_oauth_approval" value="false" class="button secondary" th:text="#{oauth.button.deny}"></button>
                <button type="submit" id="allowButton" name="user_oauth_approval" value="true" class="button primary" th:text="#{oauth.button.allow}"></button>
            </div>
        </form>
    </div>

    <script th:inline="javascript" th:attr="nonce=${script_inline_nonce}">
        /*<![CDATA[*/
        (function () {
            var cimdLogo = document.querySelector('.cimd-consent-client-logo');
            if (cimdLogo) {
                cimdLogo.addEventListener('error', function () {
                    cimdLogo.style.display = 'none';
                });
                if (cimdLogo.complete && cimdLogo.naturalWidth === 0) {
                    cimdLogo.style.display = 'none';
                }
            }
        })();
        /*]]>*/
    </script>

</div>
</body>
</html>
