<div>
  <h1 matDialogTitle>Lightweight JWT claims</h1>
  <mat-dialog-content>
    <small>A lightweight token keeps these claims and the claims on its allowlist. Other claims are removed.</small>
    <table class="lightweight-jwt-claims">
      <thead>
        <tr>
          <th></th>
          <th>Always kept</th>
          <th>Kept when the flow sets them</th>
          <th>Internal</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of keptClaims">
          <th scope="row">{{ row.token }}</th>
          <td>
            <code *ngFor="let claim of row.always">{{ claim }}</code>
          </td>
          <td>
            <code *ngFor="let claim of row.whenSet">{{ claim }}</code>
          </td>
          <td>
            <code *ngFor="let claim of row.internal">{{ claim }}</code>
          </td>
        </tr>
      </tbody>
    </table>
  </mat-dialog-content>
  <mat-dialog-actions>
    <span fxFlex></span>
    <button type="button" mat-raised-button (click)="dialogRef.close()" class="dialog-cancel">Close</button>
  </mat-dialog-actions>
</div>
