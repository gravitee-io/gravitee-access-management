<div class="gv-page-container">
  <a [routerLink]="['..']" class="gv-back-link"><small>&lt;&lt; Back to trusted domains</small></a>
  <h1>New Trusted Domain</h1>

  <div class="gv-page-content">
    <div class="gv-form-section" fxLayout="column">
      <div class="gv-form-section-title">
        <h5>Kind</h5>
        <mat-divider></mat-divider>
      </div>
      <mat-hint class="section-hint">Pick what this trusted domain is for. The settings that follow depend on it.</mat-hint>
      <mat-radio-group class="kind-choices" name="kind" [ngModel]="kind" (ngModelChange)="selectKind($event)">
        <mat-radio-button
          *ngFor="let option of TRUST_DOMAIN_KIND_OPTIONS"
          class="kind-choice"
          [value]="option.value"
          [attr.data-testid]="'kindChoice-' + option.value"
        >
          <span class="kind-choice-label">{{ option.label }}</span>
          <small class="kind-choice-hint">{{ option.hint }}</small>
        </mat-radio-button>
      </mat-radio-group>
    </div>

    <app-trust-domain-form
      *ngIf="trustDomain"
      [trustDomain]="trustDomain"
      [domainId]="domainId"
      [createMode]="true"
      [editMode]="true"
      (saved)="create($event)"
    >
      <a mat-button [routerLink]="['..']">CANCEL</a>
    </app-trust-domain-form>
  </div>
</div>
