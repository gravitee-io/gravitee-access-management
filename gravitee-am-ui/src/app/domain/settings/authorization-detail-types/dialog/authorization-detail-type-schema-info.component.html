<div>
  <h1 matDialogTitle>Schema example</h1>
  <mat-dialog-content>
    <p>This is a minimal schema for this type. Replace <code>actions</code> with the properties your type needs.</p>
    <pre>{{ example }}</pre>
    <small *ngIf="data.editable && unusableReason">{{ unusableReason }}</small>
  </mat-dialog-content>
  <mat-dialog-actions>
    <span fxFlex></span>
    <button
      *ngIf="data.editable"
      type="button"
      mat-raised-button
      color="primary"
      [disabled]="unusableReason"
      (click)="dialogRef.close(example)"
    >
      USE EXAMPLE
    </button>
    <button type="button" mat-button (click)="dialogRef.close()" class="dialog-cancel">Close</button>
  </mat-dialog-actions>
</div>
