<div class="gv-page-container">
  <h1 *ngIf="showTable">Authorization detail types</h1>
  <div *ngIf="showTable">
    <div class="authorization-detail-types-search">
      <mat-form-field appearance="fill" floatLabel="always">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Search for authorization detail types</mat-label>
        <input type="text" matInput placeholder="Search" (input)="onSearch($event)" />
      </mat-form-field>
    </div>
    <p>
      Authorization detail types are the values a client can use in the <code>type</code> member of the
      <code>authorization_details</code> parameter of a Rich Authorization Request (RFC 9396).
    </p>
    <ngx-datatable
      class="material"
      [columnMode]="'flex'"
      [headerHeight]="40"
      [footerHeight]="50"
      [rowHeight]="50"
      [rows]="authorizationDetailTypes"
      [externalPaging]="true"
      [externalSorting]="true"
      [count]="page.totalElements"
      [offset]="page.pageNumber"
      [limit]="page.size"
      [sorts]="sorts"
      (sort)="setSort($event)"
      (page)="setPage($event)"
    >
      <ngx-datatable-column name="Name" prop="name" [flexGrow]="3" [cellClass]="'authorization-detail-type-name-cell'">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div class="authorization-detail-type-information" fxLayout="column">
            <h3>{{ row.name }}</h3>
            <small *ngIf="row.description" [title]="row.description">{{ row.description }}</small>
          </div>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Type" prop="type" [flexGrow]="3"></ngx-datatable-column>
      <ngx-datatable-column name="Discovery" [flexGrow]="1" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <mat-slide-toggle (change)="toggleDiscovery(row, $event)" [checked]="row.discovery" [disabled]="!canEdit"> </mat-slide-toggle>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column
        name="Actions"
        [flexGrow]="1"
        [sortable]="false"
        *hasAnyPermission="['domain_authorization_detail_type_read', 'domain_authorization_detail_type_delete']"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div fxLayout="row" class="gv-table-cell-actions">
            <a mat-button [routerLink]="[row.id]" aria-label="Edit" *hasPermission="['domain_authorization_detail_type_read']">
              <mat-icon>settings</mat-icon>
            </a>
            <button *ngIf="canDelete" mat-button aria-label="Delete" (click)="delete(row.id, $event)"><mat-icon>delete</mat-icon></button>
          </div>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>

  <app-emptystate
    *ngIf="isEmpty"
    [message]="'Authorization detail types will appear here'"
    [subMessage]="'No data to display'"
    [icon]="'donut_large'"
  ></app-emptystate>

  <ng-container *hasPermission="['domain_authorization_detail_type_create']">
    <div *ngIf="isEmpty || showTable" [ngClass]="{ 'gv-add-button': !isEmpty, 'gv-add-button-center': isEmpty }">
      <a mat-fab color="primary" aria-label="Create" [routerLink]="['new']">
        <mat-icon>add</mat-icon>
      </a>
    </div>
  </ng-container>
</div>
