product: am
modules:
  - docker/local-stack
  - gravitee-am-authdevice-notifier
  - gravitee-am-authenticator
  - gravitee-am-authorizationengine
  - gravitee-am-botdetection
  - gravitee-am-certificate
  - gravitee-am-cockpit-mock
  - gravitee-am-common
  - gravitee-am-console
  - gravitee-am-dataplane
  - gravitee-am-deviceidentifier
  - gravitee-am-extensiongrant
  - gravitee-am-factor
  - gravitee-am-gateway
  - gravitee-am-identityprovider
  - gravitee-am-jwt
  - gravitee-am-management-api
  - gravitee-am-management-api-sdk-java
  - gravitee-am-model
  - gravitee-am-monitoring
  - gravitee-am-password-dictionary
  - gravitee-am-performance
  - gravitee-am-plugins-handlers
  - gravitee-am-policy
  - gravitee-am-reporter
  - gravitee-am-repository
  - gravitee-am-resource
  - gravitee-am-secrets
  - gravitee-am-service
  - gravitee-am-test
  - gravitee-am-ui
  - postman
  - scripts/migration-tool
hub: 0.6.0
exclude:
  - rule: context/rules/tech/ui-test-ids.md
    dirs:
      - gravitee-am-console
    reason: The console sets no data-testid; its tests query by role and accessible name
  - rule: context/rules/tech/java.md
    dirs:
      - gravitee-am-performance
    reason: A Scala Gatling project with its own pom.xml, outside the root Maven build
  - rule: context/rules/tech/typescript.md
    dirs:
      - docker/local-stack
      - postman
      - scripts/migration-tool
    reason: These folders hold no TypeScript files; their package.json only runs scripts and JavaScript tools
